name: part1
class: inverse, middle, center

&lt;div style="font-size: 34px; text-align: center;"&gt;
  Part 1. What is development, and how do we measure it?
&lt;/div&gt;

---

# From "development" to a number

- Development is many things: **health, education, agency, the environment** — with trade-offs among them

--

- But to compare countries, track progress, and evaluate policies, we need a **comparable yardstick**

--

- The workhorse yardstick is **income (or consumption) per person**

--

That choice raises three questions:

**Why income? Where are the poor? How many are poor?**

???

The MDGs (2000-15) and SDGs (2015-30) are society's negotiated list of development priorities — the posters are in the Fall 2025 deck. The rest of Part 1 then asks how much we should trust the yardstick itself.

---

# Why do we measure income?

Across countries, income lines up with nearly every other outcome we care about:

&lt;div style="text-align: center;"&gt;
&lt;iframe src="https://ourworldindata.org/grapher/life-expectancy-vs-gdp-per-capita?time=2022" loading="lazy" style="width: 100%; max-width: 720px; height: 500px; border: 0px none;" allow="web-share; clipboard-write"&gt;&lt;/iframe&gt;
&lt;/div&gt;

???

Each bubble is a country in 2022. Ask: what do you notice at the left end of the curve?

This is the Preston curve: very steep at low incomes, nearly flat at high incomes. The same doubling of income "buys" many more years of life in Malawi than in Denmark. Points for discussion: (1) income is not everything — development is also health, education, agency, the environment — but income correlates with nearly all of it, which is why poverty lines are drawn in income/consumption terms; (2) the scatter around the curve at low incomes is huge — countries at the same income differ by 15+ years of life expectancy, so income is far from the whole story. And of course these are correlations, not causal effects — that distinction is the subject of Weeks 2-3. This course is mostly about producing and interpreting such measures at the micro level.

---

# The same pattern: child survival

The gradient is there at the very start of life:

&lt;div style="text-align: center;"&gt;
&lt;iframe src="https://ourworldindata.org/grapher/child-mortality-gdp-per-capita" loading="lazy" style="width: 100%; max-width: 720px; height: 500px; border: 0px none;" allow="web-share; clipboard-write"&gt;&lt;/iframe&gt;
&lt;/div&gt;

???

Child mortality (deaths before age five) against GDP per capita. In the poorest countries roughly 1 child in 10 to 15 dies before turning five; in the richest, fewer than 1 in 200. Note the log income axis: the gradient runs through the whole distribution, and within any income level there is still large variation — policy and health systems matter beyond income.

---

# The same pattern: learning

...and in what children actually learn in school:

&lt;div style="text-align: center;"&gt;
&lt;iframe src="https://ourworldindata.org/grapher/learning-outcomes-vs-gdp-per-capita" loading="lazy" style="width: 100%; max-width: 720px; height: 500px; border: 0px none;" allow="web-share; clipboard-write"&gt;&lt;/iframe&gt;
&lt;/div&gt;

???

Harmonized learning outcomes (test scores made comparable across international assessments, World Bank) against GDP per capita. Two things to draw out: (1) the same upward gradient; (2) enormous dispersion at low and middle incomes — countries at the same income differ by more than 100 points, which previews Week 5: money alone does not produce learning. Wrap-up line for the three charts: income is our yardstick not because it is all we care about, but because it moves with nearly everything we care about.

---

# Where are the poor? Income groups over time

What patterns do you notice since 1987?

&lt;iframe src="https://ourworldindata.org/grapher/world-bank-income-groups?time=2024&amp;tab=map" loading="lazy" style="width: 100%; height: 450px; border: 0px none;" allow="web-share; clipboard-write"&gt;&lt;/iframe&gt;

---

# How poor is the world?

- &lt;a href="https://www.worldbank.org/en/news/factsheet/2025/06/05/june-2025-update-to-global-poverty-lines"&gt;**838 million**&lt;/a&gt; people below $3.00 a day in 2022; about **1.5 billion escaped** extreme poverty since 1990 — but progress has **stalled since 2020**

&lt;iframe src="https://ourworldindata.org/grapher/share-of-population-in-extreme-poverty?tab=chart&amp;country=~OWID_WRL" loading="lazy" style="width: 100%; height: 430px; border: 0px none;" allow="web-share; clipboard-write"&gt;&lt;/iframe&gt;

???

Interactive: add countries or regions to the chart live — compare East Asia with Sub-Saharan Africa to show where the remaining poverty is. Source: World Bank, June 2025 update to global poverty lines; World Bank (2024), Poverty, Prosperity, and Planet. Under the old $2.15 line the 2022 estimate was 713 million. The 2024 report notes the remaining poor are increasingly concentrated in fragile and conflict-affected settings.

---

# One morning in June 2025...

**...the estimated number of people in extreme poverty rose by 125 million, overnight.**

--

The 838 million you just saw is the count **for 2022**. Until that morning in 2025, the published count for the very same year was **713 million** — and no one's income changed.

--

What happened?

--

- The World Bank raised the International Poverty Line: **$2.15 → $3.00 a day** (2021 PPP)

--

- Three changes at once: the switch to **2021 PPPs**, **new survey data**, and **revised national poverty lines** in the poorest countries

--

**The numbers we argue about in development are *made*. The next few slides are about how.**

.source[&lt;a href="https://www.worldbank.org/en/news/factsheet/2025/06/05/june-2025-update-to-global-poverty-lines"&gt;World Bank (2025), June 2025 update to global poverty lines&lt;/a&gt;; &lt;a href="https://ourworldindata.org/new-international-poverty-line-3-dollars-per-day"&gt;Our World in Data explainer&lt;/a&gt;.]

???

Be precise on the timing if asked: the World Bank announced the update in June 2025; the revision applies retroactively to the whole estimated series (the reference year for the headline count is 2022). Same people, same incomes, new line. Details: the new lower-middle-income line is $4.20, upper-middle $8.30. The revision is almost entirely in Sub-Saharan Africa (+111 million); South Asia's count fell by 45 million. PPP rates equalize what money buys across countries using a common basket; each price round (2011, 2017, 2021) re-prices the basket, so the line and the counts move.

---

# Where does that number actually come from?

**Household survey** → consumption per person → **PPP conversion** → compare to the line

--

Judgment calls enter at every step: the basket, housing, home production, the PPP round...

--

...even **how you ask the question**:

- India's NSS (Rounds 51-54, 1994-98) **randomly assigned** households one of two questionnaires

--

- Experimental form: **7-day recall for high-frequency items** (food, pan, tobacco) and 365-day for durables and other low-frequency items; standard form: a uniform **30-day recall**

--

- The experimental form produced poverty counts **half** those of the standard form — on the order of **170 million people**, from questionnaire design alone

.source[&lt;a href="https://www.princeton.edu/~deaton/downloads/deaton_kozel_great_indian_poverty_debate_wbro_2005.pdf"&gt;Deaton and Kozel (2005), The Great Indian Poverty Debate, World Bank Research Observer&lt;/a&gt;.]

???

Two separate effects (Deaton and Kozel, p. 183): (1) people report a higher daily rate of food, pan, and tobacco expenditure over 7 days than over 30, raising measured consumption; (2) with a 365-day window for low-frequency items, most households report at least some purchases, which thickens the bottom tail of the distribution and also reduces measured poverty. The "170 million": the all-India headcount ratio was about 36% in 1993/94, roughly 340 million people, and halving the count removes about 170 million. Round 55 (1999/2000) then put both reporting periods in one questionnaire, letting respondents reconcile their answers and contaminating the estimates — Abhijit Sen called it a "failed experiment"; the "Great Indian Poverty Debate" is about how much of India's 1990s poverty decline survives this. The point for us: measurement choices are never innocent for the headline numbers.

---

# Surveys versus national accounts (Deaton 2005)

- Poverty counts come from **household surveys**; growth comes from **national accounts**

--

- The two grow at very different rates; the gap is largest in fast-growing countries (India, 1990s)

--

- "Did growth reduce poverty?" depends on which source you trust

--

**Before interpreting any development statistic, ask: who collected it, how, and what does it leave out?**

.source[&lt;a href="https://doi.org/10.1162/0034653053327612"&gt;Deaton (2005), Measuring poverty in a growing world (or measuring growth in a poor world), Review of Economics and Statistics&lt;/a&gt;.]

???

Surveys miss the rich and under-report some consumption; national accounts include things households do not consume, and are themselves badly measured in poor countries. This is the "Data" block of the reading questions, every week.

---

# GDP itself can jump 60% overnight

- **Ghana, November 2010**: the statistics office updates the base year from 1993 to 2006

--

  - GDP revised up **60%**; Ghana becomes a lower-middle-income country overnight

--

- **Nigeria, April 2014**: rebasing from 1990 to 2010 raises GDP by **89%**

--

  - Nigeria overtakes South Africa as Africa's largest economy

--

- A rebasing updates the **sector weights** to a recent year; with 1993 or 1990 weights, sectors that had grown rapidly since — telecommunications, film, retail, other services — were heavily under-represented

--

**If the level can move this much, how much do you trust the growth rates?**

.source[&lt;a href="https://en.wikipedia.org/wiki/2010_Ghana_GDP_rebasing"&gt;Ghana 2010 rebasing&lt;/a&gt;; &lt;a href="https://en.wikipedia.org/wiki/2014_Nigeria_GDP_rebasing"&gt;Nigeria 2014 rebasing&lt;/a&gt;; &lt;a href="https://www.cornellpress.cornell.edu/book/9780801451638/poor-numbers/"&gt;Jerven (2013), Poor Numbers&lt;/a&gt;.]

???

Rebasing means re-measuring the structure of the economy in a more recent base year; the old weights had frozen the economy of 1993 (Ghana) or 1990 (Nigeria). Jerven's "Poor Numbers" (2013) built a whole book on this. Zambia's 2014 rebasing added another 25%. These are level shifts, but they reveal how thin the underlying source data are — which is exactly what the Penn World Table grades on the next slide capture.

---

class: inverse, middle

&lt;div style="font-size: 26px;"&gt;
What if the official statistics are missing, or simply bad?
&lt;/div&gt;

---

# How good are official statistics?

- Penn World Tables: **all 43 Sub-Saharan African countries** get a data-quality grade of **C or D** (errors of 20-30%) — and almost nowhere is there a GDP series for a city or a district

&lt;iframe src="https://ourworldindata.org/grapher/statistical-capacity-indicator?tab=map" style="width: 100%; height: 420px; border: 0px none;" allow="web-share; clipboard-write"&gt;&lt;/iframe&gt;

.source[PWT grades as reported in &lt;a href="https://doi.org/10.1257/aer.102.2.994"&gt;Henderson, Storeygard, and Weil (2012)&lt;/a&gt;; &lt;a href="https://www.worldbank.org/en/programs/statistical-performance-indicators"&gt;World Bank Statistical Performance Indicators&lt;/a&gt;.]

???

The map is the World Bank's Statistical Performance Indicator (0-100): the capacity of each national statistical system across data use, services, products, sources, and infrastructure. The weakest scores are in Sub-Saharan Africa and fragile states — exactly where poverty measurement matters most. Some countries do not appear in the PWT at all. This is the motivation for Henderson, Storeygard, and Weil (2012), "Measuring economic growth from outer space".

---

# ...and surveys are too infrequent to fill the gap

.pull-left[
&lt;img src="figures/burke_fig1_surveys.png" style="width: 100%;" /&gt;
]

.pull-right[
- **Maps**: years between (or since) each country's economic surveys, agricultural censuses, and population censuses; black = none at all

- **Scatters**: richer and more democratic countries run **more economic surveys** (B, C) — but **how long ago** the last census was (E-I) is unrelated to income or democracy

- In **half of African countries, 6.5+ years** pass between surveys: data are scarcest exactly where poverty is greatest

.source[&lt;a href="https://doi.org/10.1126/science.abe8628"&gt;Burke, Driscoll, Lobell, and Ermon (2021)&lt;/a&gt;, Figure 1.]
]

???

Panel details: B and C plot each country's number of nationally representative economic surveys against log GDP per capita (R² = 0.26) and the Polity democracy score (R² = 0.38). D-I measure "years since" the most recent agricultural and population census — how stale the data are — with little correlation to income or democracy. A quarter of the world's countries have had no agricultural census for over 15 years. So both pillars — national accounts and surveys — are weakest exactly where we need them most.

---

class: inverse, middle, center

&lt;div style="font-size: 28px; text-align: center;"&gt;
So what can we do?
&lt;/div&gt;

--

&lt;div style="font-size: 24px; margin-top: 1em; text-align: center;"&gt;
Advances in technology have opened a second source of data: &lt;b&gt;the view from space&lt;/b&gt;.
&lt;/div&gt;

???

The pivot of Part 1: satellites observe every place on Earth, repeatedly, at near-zero marginal cost. Two generations of this work follow: night lights (Henderson, Storeygard, and Weil), then daytime imagery plus machine learning (Burke et al.).

---

# Lights at night as a measure of economic activity

The first new source: **night lights**, recorded by weather satellites since the 1990s

&lt;div style="text-align: center;"&gt;
  &lt;img src="figures/hsw_world_lights.png" style="width: 100%; max-width: 700px;" /&gt;
&lt;/div&gt;

.source[&lt;a href="https://doi.org/10.1257/aer.102.2.994"&gt;Henderson, Storeygard, and Weil (2012)&lt;/a&gt;, Figure 1. Lights at night, 2008 (NOAA/DMSP data).]

---

# The Korean peninsula, 1992 and 2008

.pull-left[
&lt;img src="figures/hsw_korea.png" style="width: 100%; max-width: 560px;" /&gt;
]

.pull-right[
- South Korea: GDP **+119%**, lights **+72%**

- North Korea: no growth, lights **-7.4%**

- Lights are a **noisy but independent** measure of income

- Combined with official data, they revise growth by up to **3 percentage points** a year for countries with weak statistics
]

.source[&lt;a href="https://doi.org/10.1257/aer.102.2.994"&gt;Henderson, Storeygard, and Weil (2012)&lt;/a&gt;, Figure 2.]

???

The elasticity of measured GDP growth with respect to lights growth is about 0.3. For countries with weak statistical systems, the optimal composite puts roughly equal weight on official growth and lights-predicted growth. The key idea: the measurement error in lights is unrelated to the error in the national accounts, so two noisy measures beat one.

---

# From lights to imagery and machine learning

&lt;div style="text-align: center;"&gt;
  &lt;img src="figures/burke_summary.png" style="width: 100%; max-width: 860px;" /&gt;
&lt;/div&gt;

--

- Satellites now revisit most places **daily**, at **meter-scale** resolution

- Models trained on imagery explain **more than half, often over 75%**, of village-level asset wealth

.source[&lt;a href="https://doi.org/10.1126/science.abe8628"&gt;Burke et al. (2021), Science&lt;/a&gt;.]

---

# Satellites: what they can and cannot do

**Can:** measure at fine scale and high frequency where no survey exists

- village wealth, crop yields, informal settlements, deforestation, pollution

--

**Cannot:** replace ground data

- the constraint is now **training and validation data**, not imagery

--

**And for this course:**

&gt; "ML as a complement to causal designs ... without abandoning identification discipline."
&gt; (&lt;a href="https://www.nber.org/reporter/2026number1/program-report-development-economics"&gt;Jayachandran and Olken 2026&lt;/a&gt;)

--

Measuring *y* better does not tell you what caused *y*. **That is Weeks 2-3.**

???

Burke et al. show that noisy test data make satellite models look worse than they are; satellites amplify rather than replace ground-based data collection. Many papers on this syllabus use such data, especially in Weeks 9 and 10.

---

name: part2
class: inverse, middle, center

&lt;div style="font-size: 34px; text-align: center;"&gt;
  Part 2. What causes (under)development, and what is the field working on now?
&lt;/div&gt;

---

# The evolution of development economics

- Classical economists of the 17th-19th centuries were all development economists (&lt;a href="https://doi.org/10.1257/jep.7.2.129"&gt;Bardhan 1993&lt;/a&gt;): the transformation from agrarian to industrial

&lt;div style="text-align: center;"&gt;
  &lt;img src="figures/evolution.png" style="width: 100%; max-width: 900px;" /&gt;
&lt;/div&gt;


---

# Why are some countries poor? The grand debates

- **Sachs**: poverty traps and multiple equilibria; escape requires a **big push** of aid

--

- **Easterly**: skeptical of grand plans; favor **small-scale experimentation** and feedback

--

- **Acemoglu and Robinson**: **institutions** are the deep cause

--

- **Rodrik**: no universal recipe; find each country's **binding constraint**

--

Country-level evidence could not settle these debates.

--

**Banerjee and Duflo's answer: go micro** — understand the choices poor households actually face, and **evaluate rigorously**. That is the field this course studies.

???

Key references if asked: Sachs, The End of Poverty (2005); Easterly, The White Man's Burden (2006); Acemoglu and Robinson, Why Nations Fail (2012); Rodrik, One Economics, Many Recipes (2007); Banerjee and Duflo, Poor Economics (2011). All these views are still alive; the point is that cross-country regressions could not adjudicate among them, which pushed the field toward micro data and credible designs.

---

# What is development economics today?

&lt;a href="https://doi.org/10.1093/wber/lhx015"&gt;McKenzie and Paffhausen (2017)&lt;/a&gt;: 200+ courses, four views of the field

--

- **Macro**: growth, trade, industrial policy

- **Empirical micro**: impact evaluation; credit, land, labor markets

- **Core topics**: growth, poverty and inequality, human capital, institutions

- **Expansive**: agriculture, aid, migration, entrepreneurship, behavior

--

&lt;a href="https://doi.org/10.1257/jel.20211537"&gt;Buera, Kaboski, and Townsend (2023)&lt;/a&gt;: micro and macro are **converging**

.week[This course: Weeks 4-8 micro frictions, Week 9 what they add up to]

--

So what does this field actually produce? The &lt;a href="https://www.nber.org/reporter/2026number1/program-report-development-economics"&gt;2026 NBER program report&lt;/a&gt; identifies **four themes** in 2018-2025 research.

???

BKT argue that micro evidence on frictions (credit, insurance, labor, information) is increasingly used to discipline macro models of development, and macro models are used to ask what micro estimates imply at scale.

---

# Theme 1: Social protection

.pull-left[
&lt;img src="figures/nber_fig1_tup.png" style="width: 100%;" /&gt;
]

.pull-right[
- Cash is now cheap to deliver, so the questions moved to **GE effects, long-run effects, targeting**

- The figure: the "graduation" program in India, **ten years** on

- Why do effects persist? **Poverty traps**, or just a large transfer?

&lt;span class="week"&gt;Week 4&lt;/span&gt;
]

.source[&lt;a href="https://www.nber.org/reporter/2026number1/program-report-development-economics"&gt;Jayachandran and Olken (2026)&lt;/a&gt;, Figure 1.]

???

Egger et al. (2022): a fiscal multiplier of about 2.5 in rural Kenya. Banerjee, Duflo, and Sharma (2021) for the figure. Balboni et al. (2022) argue for traps; Karlan, Raswan, and Udry (2026) re-test across seven programs and are not convinced. Both are required in Week 4.

---

# Theme 2: The psychology of poverty

.pull-left[
&lt;img src="figures/nber_fig2_kaur.png" style="width: 100%;" /&gt;
]

.pull-right[
- Does being poor affect attention and productivity?

- Paying workers **earlier** raises productivity, but only for the **poorer half**

- Financial worry occupies attention on the job

&lt;span class="week"&gt;Week 7 (presentation paper)&lt;/span&gt;
]

.source[&lt;a href="https://www.nber.org/reporter/2026number1/program-report-development-economics"&gt;Jayachandran and Olken (2026)&lt;/a&gt;, Figure 2.]

???

Kaur, Mullainathan, Oh, and Schilbach (2025, QJE). Related work: mental-health interventions raise human capital; employment has psychosocial value beyond income (next slide).

---

# Theme 2, continued: work is more than income

.pull-left[
&lt;img src="figures/nber_fig3_work.png" style="width: 100%;" /&gt;
]

.pull-right[
- Refugee camps in Bangladesh: 450 taka a week **for three days of work**, versus the same cash **for nothing**

- Work improves mental health and stability **more than the cash** does

- A job is worth more than its wage

&lt;span class="week"&gt;Weeks 7-8&lt;/span&gt;
]

.source[&lt;a href="https://www.nber.org/reporter/2026number1/program-report-development-economics"&gt;Jayachandran and Olken (2026)&lt;/a&gt;, Figure 3.]

???

Hussam, Kelley, Lane, and Zahra (2022, AER). This changes how we think about workfare, unemployment, and job-search policies.

---

# Theme 3: Microdata for macro questions

- Administrative data and **experiments at scale** now let us measure **general-equilibrium** effects, rather than assume them away

--

- Examples in the report: cash transfers in Kenya; distortions across firms and workers; market platforms in Uganda; rental markets for machinery

--

- The question is what micro frictions **add up to**

.week[Week 4 (transfers), Week 7 (public employment), Week 9 (structural transformation)]

???

Egger et al.; Atkin et al.; Bergquist, McIntosh, and Startz; Caunedo and Kala; Bassi et al. Unifying idea from Buera, Kaboski, and Townsend (2023).

---

# Theme 4: Environment and development

.pull-left[
&lt;img src="figures/nber_fig4_pollution.png" style="width: 100%;" /&gt;
]

.pull-right[
- Climate change hits poor countries hardest, and adaptation is harder when markets and states are weak

- The figure: citizen complaints cut pollution violations in China, but only when made **publicly**

- From documenting damages to **adaptation, regulation, political economy**

&lt;span class="week"&gt;Week 10&lt;/span&gt;
]

.source[&lt;a href="https://www.nber.org/reporter/2026number1/program-report-development-economics"&gt;Jayachandran and Olken (2026)&lt;/a&gt;, Figure 4.]

???

Buntaine et al. (2024, AER): a nationwide experiment; complaints posted on social media reduce violations, private appeals to the regulator do not.

---

# How the toolkit shifted, 2013-17 versus 2021-25

--

- From small-scale RCTs to **administrative data at scale**

--

- **Quasi-experimental designs** with rich data: thresholds, staggered rollouts, event studies

--

- **Long-run and dynamic** effects: persistence, fade-out, next generation

--

- **Measurement and machine learning**, as a complement to causal designs

--

**Most of the frontier is not an RCT.** That is why Weeks 2-3 teach IV, DiD, and RD alongside randomization.

???

The program directors asked an AI model to summarize 1,972 NBER working papers and judged its description "broadly consistent" with their own reading. Quote on long-run effects: they "fundamentally change how interventions are judged".

---

# What the field stopped doing

--

- **Microcredit** as a standalone growth tool

--

- **Technology adoption** studied in isolation from structural change  .week[Week 9]

--

- Education judged by **test scores** alone  .week[Week 5: long-run outcomes]

--

- **Informality** as a binary  .week[Week 8: a spectrum]

--

You will see each of these choices in the reading list.

name: part3
class: inverse, middle, center

&lt;div style="font-size: 34px; text-align: center;"&gt;
  Part 3. How we approach development economics in this course
&lt;/div&gt;

---

# Our approach

- **Empirical, micro-based**: the problems faced by poor households

--

- Focus on **labor**: education, health, productivity, labor markets

--

- Why labor? For poor households, **labor is the main asset**

--

- Then: what it adds up to (Week 9), and the environment (Week 10)

--

- Evidence from experiments **and** from well-designed natural experiments

--

Two skills every week: **reading a paper critically** and **communicating research**

---

# Course snapshot: Weeks 2-4

**Weeks 2-3: causal inference and empirical strategies**

- Randomization, IV and LATE; DiD (including staggered adoption), RD, inference

- Each method with a development paper: &lt;a href="https://doi.org/10.1093/qje/qjw025"&gt;Haushofer and Shapiro&lt;/a&gt;; &lt;a href="https://doi.org/10.1257/aer.91.5.1369"&gt;Acemoglu, Johnson, and Robinson&lt;/a&gt;; &lt;a href="https://doi.org/10.1016/j.jpubeco.2023.104999"&gt;Gruber, Lin, and Yi&lt;/a&gt;; &lt;a href="https://doi.org/10.1086/730204"&gt;Burlig and Preonas&lt;/a&gt;

--

**Week 4: poverty traps and ultra-poor programs**

- Does being poor keep you poor? How would we know?

- What happens to the rest of the village when we help some households?


---

# Course snapshot: Weeks 5-6

**Weeks 5-6: human capital (education and health)**

- Returns to schooling, from &lt;a href="https://doi.org/10.1111/1468-0262.00237"&gt;Card (2001)&lt;/a&gt; to intergenerational evidence

- Constraints to education and health: information, income shocks, social image

--

Questions we will ask:

- Do parents misjudge their children's ability, and invest accordingly?

# Can you formulate your ideas as research questions?

--

- The most interesting research tends to be about **cause and effect**

--

  - the effect of schooling on wages; of unemployment insurance on jobs; of cash transfers on enrollment

--

- Think of an **ideal experiment** that would capture the effect

--

  - "the effect of a cause is always relative to another cause"

--

  - If you cannot imagine the experiment, the odds with non-experimental data are slim

---

# A good research question: three properties

From &lt;a href="https://shapiro.scholars.harvard.edu/sites/g/files/omnuum7731/files/shapiro/files/foursteps.pdf"&gt;Shapiro, Four Steps to an Applied Micro Paper&lt;/a&gt;:

--

- **The question has an answer.** "What is the effect of a price ceiling on the quantity of ketchup sold?" has one — we may not know it, but it exists. "What is the nature of firm and consumer behavior in the ketchup industry?" does not

--

- **The answer is not obvious** — we cannot already get it from logic, common sense, or existing evidence. "Would selling ketchup only on Tuesdays improve consumer welfare?" has an answer, but we can guess it

--

- **The answer is actionable.** If we knew it, a policymaker, firm, or NGO would do something differently. Uniform wholesale pricing of ketchup: real policy, actionable. Ketchup teleportation: hypothetical

--

Test your question against all three **before** worrying about data or identification.

???

The examples are Shapiro's, originally written for PhD students in industrial organization. "Actionable" is the "why should people care" test from the writing-a-dissertation slide, applied to the answer rather than the topic. And "has an answer" is the deepest of the three — the next slides show questions that look causal but have no answer at all: fundamentally unidentified questions.

# Fundamentally unidentified questions

The effect of **school start age** on test scores.

--

Ideal experiment? Randomize:

- Group 1 starts first grade at age 6

- Group 2 starts first grade at age 7

then compare first-grade test scores.

--

- Q1: Is there any problem with this experiment?

- Q2: Does the difference in test scores capture the effect of start age?

---

# Fundamentally unidentified questions

- Q1: No problem with the experiment

--

- Q2: The difference also captures a **maturation effect**: Group 2 is older

--

Hold age constant instead?

- Group 1 starts at 6, tested in second grade

- Group 2 starts at 7, tested in first grade

--

Now the difference also reflects **time in school**.

--

While kids are in school: **start age = current age - time in school**. The three effects cannot be separated.

---

&lt;div style="margin-top: 18px;"&gt;While children are in school, &lt;b&gt;A = S + T&lt;/b&gt;: any change in S must show up in A or in T — there is no third design. For adults, &lt;b&gt;W varies too&lt;/b&gt;, so S can differ while T and A stay fixed.&lt;/div&gt;

???

Walk through the tables. Design 1 fixes the grade at the test: the two groups then differ in start age AND in age at the test, so the comparison mixes the start-age effect with maturation. Design 2 fixes age at the test: the groups then differ in start age AND time in school. Because A = S + T holds for every child in school, there is no way to vary S alone — that is the fundamentally unidentified question. For adults the identity becomes A = S + T + W, and W (years since leaving school) varies across people, so we can find people with the same age and the same years of schooling who started at different ages: the effect of start age on adult outcomes is identified. The grey W cells absorb the difference. This sets up the regression slide that follows.

---

# The same thing, in regression language

Suppose we ran the "ideal" regression on children in school:

`$$y_i = \alpha + \beta_S S_i + \beta_T T_i + \beta_A A_i + \varepsilon_i$$`

--

- But `\(A_i = S_i + T_i\)` for **every** child: the three regressors are **perfectly collinear**

--

- The design matrix has rank 3, not 4. Stata drops one variable; whichever it drops, the coefficient you get is a **mixture**: e.g., drop `\(A\)` and the coefficient on `\(S\)` is `\(\beta_S + \beta_A\)`

--

- Randomizing `\(S\)` does **not** help: this is not confounding, it is a **definition**

--

- For adults, `\(A_i = S_i + T_i + W_i\)` with years since school `\(W_i\)` varying across people: full rank, `\(\beta_S\)` identified

???

Perfect multicollinearity is usually taught as a nuisance ("drop a dummy"). Here it is the substance: the question itself is not identified, and no amount of data or randomization fixes that. Only a different question, with a different population, does. The same logic underlies the age-period-cohort problem.

---

# Fundamentally unidentified questions

When does that identity break?

--

- In **adulthood**: people can have started at different ages, be observed at the same age, with the same years of schooling

--

So **twist the question**: the effect of school start age on **adult earnings** is identified.

# Before you commit: five feasibility checks

A question can be well-posed, non-obvious, and actionable — and still not be *your* project. Ask:

--

- Do I have the **facts** right?

--

- Do I have the right **data**?

--

- Would the effect be **detectable**? Is the sample large enough?

--

- Is the paper interesting **if I find nothing**?

--

- Can I finish it in **reasonable time**?


---

# How to read a paper: seven questions

1. **Question and contribution**: what is new?

2. **Ideal experiment**: how far is the paper from it?

3. **Theory**: assumptions, testable predictions

4. **Data**: unit, variables, measurement, selection

5. **Empirical strategy**: estimand, identification, inference

6. **Results**: magnitudes, alternative interpretations, mechanisms

7. **Broader lessons**: external validity, policy, one idea for you

???

This is the structure of the weekly comments, of a good discussion, and of your own proposal. The sub-questions are in the syllabus.

---

# How to present a paper: the skeleton

A 30-minute conference-style talk, 15-20 slides:

1. **Motivation and question**: one slide

2. **What we do and what we find**: one slide

3. **Setting and data**

4. **Research design**: estimand, identifying assumption, why plausible

5. **The main result**: one figure or table

6. **Threats and robustness**: the discussant's objections, answered

7. **Takeaways**

???

Based on Shapiro, "How to give an applied micro talk". In Week 2 I will present Haushofer and Shapiro (2016) this way and then take it apart with you; in Week 3 each of you will do a 5-minute, 3-slide version.

---

# How to write a paper

*"Do one thing and do it completely"* (Richard Blundell)

--

- Not many things at once; not everything you know

--

- Tell **one convincing story**: every result is a piece of the same jigsaw puzzle

--

- Read papers for **how** they tell their story, not only what they find

---

# Presenting your own work

- Present whenever you can: friends, faculty, conferences

--

- Prepare three versions: **1 minute**, **5 minutes**, **15-20 minutes**

--

- Know how your paper differs from the others on the same question

--

- Guides by Jesse Shapiro: &lt;a href="https://shapiro.scholars.harvard.edu/sites/g/files/omnuum7731/files/shapiro/files/applied_micro_slides.pdf"&gt;How to give an applied micro talk&lt;/a&gt; and &lt;a href="https://shapiro.scholars.harvard.edu/sites/g/files/omnuum7731/files/shapiro/files/foursteps.pdf"&gt;Four steps to an applied micro paper&lt;/a&gt;
