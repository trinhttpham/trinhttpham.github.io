# What are poverty traps?

Poverty traps are, at their core, about **asset accumulation**:

- assets `\(\rightarrow\)` investment `\(\rightarrow\)` productivity `\(\rightarrow\)` earning potential

--

Why does it matter whether poverty traps exist?

--

- if poverty is **transitory** (temporary adverse shocks), short-term income or consumption support may suffice

--

- if a **trap** makes poverty **chronic**, a one-time "big push" past a threshold can have large, persistent effects

  - migration can lift some people out of a trap, but its cost can itself keep the poor in place (&lt;a href="https://doi.org/10.1257/jep.28.3.127"&gt;Kraay and McKenzie 2014&lt;/a&gt;)

???

The policy stakes are the reason the empirical debate later today matters: if traps exist, a one-time transfer can permanently change a household's trajectory; if they do not, the same transfer raises assets temporarily and households drift back toward where they started, so ongoing support is the relevant policy.

---

# A simple framework (Barrett, Carter, and Chavas 2019)

Income of household `\(i\)` in period `\(t\)`:

`$$y_{it}=f_l(\alpha_{it}, k_{it} \mid N_t)$$`

--

- `\(k_{it}\)`: **tangible productive assets** — land, livestock, machinery, money, other capital

--

- `\(\alpha_{it}\)`: **human capabilities** — skills, human capital, perceived self-efficacy

--

- `\(N_t\)`: **natural capital** — raises the productivity of assets and capabilities

--

- capabilities and tangible assets are **complements** in production

---

# A simple framework: constraints

Assume no financial markets and no informal transfers.

--

- **Consumption**: `\(c_{it}\leq k_{it} + y_{it}\)` — no more than cash on hand (productive assets plus current income)

--

- **Capital next period**: `\(k_{it+1}=[k_{it}+y_{it}-c_{it}][1+\delta_0+\delta_1(\theta_{it+1})]\)`

  - `\(\delta_0\)`: natural growth of assets if `\(\delta_0&gt;0\)`, e.g., herd reproduction; depreciation if `\(\delta_0&lt;0\)`

  - `\(\delta_1(\theta_{it+1}) \leq 0\)`: asset loss driven by a random shock `\(\theta_{it+1}\)`

--

- For now, capabilities are fixed at each household's initial endowment: `\(\alpha_{it} = \alpha_i\)`

---

class: compact

# Putting the pieces together

Household `\(i\)` solves:

`$$\max_{c_{it},k_{it}} \; E_\theta\sum_{t=0}^\infty\beta^tu(c_{it})$$`

--

subject to:

$$
`\begin{align*}
c_{it} &amp;\leq k_{it} + y_{it} \\
y_{it} &amp;= f_l(\alpha_{it}, k_{it}, \theta_{it} \mid N_t) \\
k_{it+1} &amp;= [k_{it}+y_{it}-c_{it}][1+\delta_0+\delta_1(\theta_{it+1})] \\
\alpha_{it+1} &amp;= \alpha_{it} = \alpha_i \\
k_{it} &amp;\geq 0
\end{align*}`
$$

--

**Solving it, in four steps** (details in the appendix):

1. each period, split cash on hand between consuming today and saving for tomorrow
2. at the optimum, the utility cost of saving today equals its discounted return tomorrow
3. capital stops changing when its marginal return equals the required return `\(\rho\)`: this gives `\(k^*_l(\alpha)\)`, rising in `\(\alpha\)`
   - `\(\rho\)` reflects impatience, net of the natural growth of capital
4. the capability level at which steady-state income equals the poverty line is `\(\alpha_0\)`

The diagram is redrawn from Barrett, Carter, and Chavas (2019), Figure I.1, so that each step can highlight the piece being discussed; the curves are schematic. Order of steps: the poverty locus and the poor region; the steady-state curve (derived in the appendix); their crossing at alpha_0; a household above alpha_0 hit by a shock and saving its way back; the stretch of the steady-state curve below alpha_0, where households are chronically poor; and the effect of a less productive technology, which shifts the locus up and the steady-state curve down, moving alpha_0 to the right.

---

# When capabilities change

Let capabilities evolve over time:

`$$\alpha_{it+1}=\alpha_{it}\,[1+\xi_0(c_{it})+\xi_1(\theta_{it})]$$`

--

- `\(\xi_0(c_{it}) &lt; 0\)` when shocks force consumption cuts: capabilities deteriorate through these choices

  - e.g., cutting children's schooling or nutrition after a bad harvest

--

- `\(\xi_1(\theta_{it}) \leq 0\)`: direct destruction of capabilities by shocks

  - e.g., temperature spikes damage the brain development of the unborn; an economic shock induces depression

--

&lt;div class="takeaway"&gt;A single shock can push a household's capabilities below \(\alpha_0\) — and into chronic poverty&lt;/div&gt;

---

# A richer framework: two technologies

Financial markets are still missing.

--

Households can choose between two technologies:

- a low-productivity technology `\(f_l\)`, and a high-productivity technology `\(f_h\)`

- `\(f_h\)` has fixed costs or a minimum project size: `\(f_h &gt; f_l\)` only when `\(k &gt; \hat{k}\)`

--

Income is the better of the two:

`$$y_{it} = \max \left[\, f_l(\alpha_{it}, k_{it} \mid N_t), \; f_h(\alpha_{it}, k_{it} \mid N_t) \,\right]$$`

--

- the fixed cost makes the technology set non-convex: output is not concave in `\(k\)`

- a household can end at a **low** or a **high** steady state

  - which one depends on its starting capital and capabilities (appendix)

&lt;p&gt;&lt;span style="color:#C0392B;"&gt;&lt;strong&gt;Below \(\underline{\alpha}\)&lt;/strong&gt;&lt;/span&gt;: saving toward \(k^*_h\) never pays; households move to \(k^*_l\), whatever their initial \(k_i\) &amp;mdash; a &lt;strong&gt;single-equilibrium&lt;/strong&gt; poverty trap.&lt;/p&gt;

# Policy implications

**Low capabilities** `\((\alpha&lt;\underline{\alpha})\)`: persistently poor, whatever their starting capital

- they need **ongoing** transfers to supplement their earnings — unless their capabilities can be raised

--

**Middle capabilities** `\((\underline{\alpha}&lt; \alpha&lt; \bar{\alpha})\)`: may escape through asset accumulation

- policies that relax their constraints (e.g., microfinance) can help them cross the Micawber frontier

  - if the binding constraint is skills or psychology, credit alone will not help

  - so the effects of microfinance and microenterprise programs vary across households

---

# With a fixed budget, whom should we help?

&lt;a href="https://doi.org/10.7208/chicago/9780226574448.003.0006"&gt;Ikegami, Carter, Barrett, and Janzen (2019)&lt;/a&gt;: the **social protection paradox**

- shifting some of a fixed budget to the **vulnerable non-poor** after shocks lowers medium-term poverty

  - it stops the vulnerable from falling into chronic poverty

  - but poverty is higher in the short term, since less goes to the currently poor

  - the result assumes that households do not anticipate the transfers

--

Identifying the **root cause** of a trap matters:

- if credit and insurance market failures bind, fixing them brings indirect, general-equilibrium benefits

  - these can far exceed the direct effects of small-scale interventions

--

- e.g., BRAC's asset transfers to poor women in Bangladesh (&lt;a href="https://doi.org/10.1093/qje/qjx003"&gt;Bandiera et al. 2017&lt;/a&gt;)

  - raised the low-skill wages of non-participants

# Types of intervention

- **"Big push"** interventions

  - a one-time boost of capital or support to help households escape the low equilibrium

--

- **Multifaceted** interventions, a.k.a. **graduation programs**

  - combine support for immediate needs with long-term livelihood support (asset transfers, training, savings)

  - pioneered by BRAC in Bangladesh

# &lt;a href="https://doi.org/10.1093/qje/qjab045"&gt;Balboni et al. (2022)&lt;/a&gt;: "Why do people stay poor?"

Why are the world's poor employed, yet earn so little?

--

Two views, with different implications:

--

- **View 1**: the poor have the same opportunities, but traits that suit them only to low-earning work

  - no trap: after a "big push", they drift back to where they started

--

- **View 2**: the poor face different opportunities, and take low-earning jobs because they are born poor

  - their initial wealth, not their abilities or traits, keeps them in low-earning work

  - a trap: a "big push" can lift them out of poverty permanently

--

The paper sets out to distinguish these two views.

---

# Theoretical framework: the intuition

Next year's assets = the assets you keep + what you save from this year's earnings:

`$$K_{i,t+1} = \Phi_i(K_{i,t}) = \underbrace{(1-\delta)\,K_{i,t}}_{\text{assets kept}} \; + \; \underbrace{s_i \, A_{i,v} \, f(K_{i,t})}_{\text{new savings}}$$`

--

- **earnings**, `\(A_{i,v} f(K_{i,t})\)`: depend on your assets `\(K\)` (a cow, land) and your productivity `\(A_{i,v}\)`

  - `\(A_{i,v}\)` combines individual traits (skills, health) and village traits (markets, infrastructure)

- `\(s_i\)`: the share of earnings you save; `\(\delta\)`: the share of assets lost each year — a cow ages, tools wear out

--

- assets stop changing — a **steady state** — when new savings just replace what is lost: `\(s_i A_{i,v} f(K_i^*) = \delta K_i^*\)`

--

.discuss[**Discussion** — does each household have one steady state, or two, depending on where it starts?]

???

Notation: K and A_{i,v} here play roughly the roles of k and alpha in the Barrett, Carter, and Chavas framework. The paper writes the general transition equation as K_{i,t+1} = Phi_i(K_{i,t}) and uses the savings form above as a special case, in a world without credit or rental markets: households can grow their assets only out of their own earnings. A_{i,v} collects individual traits (skills, health) and village traits (markets, infrastructure) that make the same assets more or less productive. Plotting next year's assets against this year's gives the transition curve; wherever it meets the 45-degree line, assets stop changing. The next slides ask how many such points there are, and which are stable.

&lt;div style="display: table-cell; vertical-align: top; width: 70%; padding-left: 10px;"&gt;
&lt;p&gt;&lt;strong&gt;Case 2: a poverty trap (S-shaped curve)&lt;/strong&gt;&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;the curve crosses the 45-degree line &lt;strong&gt;three times&lt;/strong&gt;: \(K_P^*\), \(\hat{K}\), \(K_R^*\)&lt;/li&gt;
&lt;li&gt;\(K_P^*\) and \(K_R^*\) are stable; \(\hat{K}\) is unstable: the &lt;strong&gt;threshold&lt;/strong&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;ul&gt;
&lt;li&gt;households starting below \(\hat{K}\) drift down to \(K_P^*\); those above grow to \(K_R^*\)&lt;/li&gt;
&lt;li&gt;the poor are poor because of &lt;strong&gt;low initial assets&lt;/strong&gt;: same \(A_{i,v}\) and \(s_i\) as the rich, lower starting \(K\)&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;

# Testing for poverty traps

**Test 1**: if the **transition equation** `\(\Phi_i(K_{i,t})\)` is globally concave, there cannot be multiple stable equilibria

- a nonparametric shape test (&lt;a href="https://arxiv.org/abs/1909.01675"&gt;Komarova and Hidalgo 2019&lt;/a&gt;) rejects global concavity at the 1% level

--

**Test 2**: a poverty trap exists if and only if there is a **threshold** level of capital `\(\hat{K}\)`

- those below `\(\hat{K}\)` converge to a low stable steady state

- those above `\(\hat{K}\)` converge to a high stable steady state

--

The general idea: track the evolution of assets over time, across initial asset levels

???

Analogy: marbles resting in two bowls separated by a ridge. Where the marbles rest tells you where the bowls are, not whether there is a ridge between them; two separate tables, each with one bowl, would look the same. To find the ridge, place marbles near the top and watch which way they roll. Second bullet: the paper reports that asset changes of the same magnitude as the BRAC transfer occur for only 5.9% of control households, over both the two-year and the four-year horizon. Fourth bullet: identical households on an S-shaped transition equation produce a bimodal distribution, but so do two types of households, each with a concave transition equation and its own steady state (Balboni et al. 2022, pp. 802-803).

# Heterogeneous poverty thresholds: what they find

The threshold is **not** the same for everyone:

- **lower** for households with higher village earnings potential, some education, or a higher savings rate

- **higher** for households reporting mental anxiety

- no difference by BMI or by non-business assets

--

.takeaway[Traps can be household-specific: the same transfer can lift one household out and leave another behind]

---

# Poverty traps in the long run

`$$Y_{i,t} = \beta_0I[k_{i,1}&gt;\hat{k}] + \sum_t \beta_{1,t} I[k_{i,1}&gt;\hat{k}]S_t + \sum_t\beta_{2,t}S_t + \eta_{i,t}$$`

- `\(S_t\)`: follow-up survey rounds — 2009, 2011, 2014, and 2018 (2007, just after the transfer, is the base)

- subdistrict fixed effects

--

What does `\(\beta_{1,t}\)` tell us?

--

- the extra above-vs-below gap at date `\(t\)`, relative to the gap just after the transfer

- Ethiopia, Ghana, Honduras, India, Pakistan, Peru

- a productive asset, temporary consumption support, training, home visits, savings, and health services

- large, lasting average effects: all 10 outcome indices improve; 8 of 10 remain significant at the second endline

# &lt;a href="https://www.nber.org/papers/w35253"&gt;Karlan, Raswan, and Udry (2026)&lt;/a&gt;: the question

"The Sisyphean pursuit of evidence for poverty traps"

- is the Balboni et al. threshold robust — and does it appear elsewhere?

--

Three steps:

- **seven other graduation programs**: the six Banerjee et al. sites, plus another BRAC program in Bangladesh

- **the Balboni et al. data again**: the log transformation, and geography

- **representative panels**: rural households in Bangladesh (8 years) and Ghana (12 years)

--

They confirm the program's large average effects — the question is whether there is a **threshold**.

???

The title's metaphor, in their footnote 3: the pursuit fails "not for lack of effort or skill but because the problem is unlikely achievable by structure" — and they stress it implies nothing about the character of any researcher.

--

- Balboni et al. use `\(\log(\text{assets}/1000+1)\)`, because 8.4% of households report zero assets

- of the five transformations, only this one crosses the 45-degree line from below

- in levels, the curve lies above the 45-degree line: average assets grow at every starting level

# Cows or places?

&lt;div style="text-align: center;"&gt;

--

- the **local cow price** explains four times as much of who lands above `\(\hat{K}\)` as pre-transfer assets

- within low- or high-cow-price branches, the S-shape disappears

---

# Cows or places?

High-cow-price branches differ in other ways:

- less exposure to **river erosion**, more NGO activity, more electricity, more educated household heads

- 75% of low-cow-price branches face river erosion, against 42% of high-cow-price branches

--

Controlling for river erosion over time:

- the long-run gains above the threshold are no longer significant for cows, productive assets, and earnings

- they remain for consumption and hours worked

--

.takeaway[The apparent threshold may reflect **where** households live, not how many assets they start with]

---

# Other programs and national panels

**Seven other graduation programs** (eight samples with Balboni et al.):

- in none do they find convincing evidence of a transition function crossing the 45-degree line from below

- binary tests find a sharp rise in the share with growing assets only in the Balboni et al. data

--

**Representative panels** (Bangladesh, Ghana):

- no S-shape; in Ghana, convergence to a single steady state

--

Their conclusion: this is **not** evidence against poverty traps — direct validation is "extremely challenging"

- the way forward: map local investments' costs, returns, and indivisibilities; vary **transfer sizes**

# The authors' reply

&lt;a href="https://www.nber.org/data-appendix/w35253/povertyTraps_reply.pdf"&gt;Balboni, Bandiera, Burgess, Ghatak, and Heil (2026)&lt;/a&gt;:

"Why do people stay poor? A research agenda for poverty traps"

--

- three reasons for poverty can **coexist**: transitory misfortune, persistent disadvantage, and a poverty trap

- with heterogeneous households, a pooled S-shape is "neither necessary nor sufficient" for a trap

--

- levels estimate the transition for the mean-productivity household; logs, for the median one

  - assuming log productivity is symmetric and independent of assets

- the Arunachalam–Shenoy tests that Karlan et al. run reject convergence in both cow-price areas

- divergence persists and widens over eleven years, suggesting some households were trapped

--

- the agenda: move beyond "do traps exist?" to **who** is trapped — with long-run data from past RCTs

???

Levels versus logs: this is the reply's Section 3 and appendix. With A_i independent of assets and log A_i symmetric, a local linear regression in levels recovers the transition equation of the mean productivity type, and one in logs that of the median type. Implication: since A_i is then right-skewed, the mean exceeds the median, so the levels curve sits higher. Their footnote 3 adds that replacing the arbitrary +1 inside the log with a floor (the lowest-value asset owned by poor households in the same subdistrict) gives a transition equation very similar to the 2022 one, crossing the 45-degree line from below. On the cow-price split, the reply also points to the control-village evidence in the 2022 paper. The reply cites Jee (2025): 27 randomized cash and asset-transfer experiments, nearly 75,000 households in 17 countries; increasing returns in roughly half of the studies, and even where a trap exists only a share of households, those with low productivity, is trapped.

**Agree**:

- the program has large, persistent average effects; heterogeneity is central; a pooled S-shape can mislead

--

**Disagree**:

- whether the Bangladesh evidence identifies a trap, or reflects geography

- which transformation and which test are informative

- whether thresholds generalize beyond Bangladesh

Both proposed designs are worth drawing out. Karlan, Raswan, and Udry: map the local investment options (their costs, returns, and indivisibilities), then randomize transfer SIZES below versus at or above the hypothesized threshold. Balboni et al.: exploit large randomized shocks and long-run follow-ups, with control villages, and model heterogeneity in who is trapped. A randomized variation in transfer size is the cleanest test either side mentions: if a trap exists at a threshold, households given slightly more than the threshold should diverge from those given slightly less.

# Solving the model: consume or save?

Each period, cash on hand `\(k_t + y_t\)` is split between consumption and saving.

- the constraint `\(c_t \leq k_t + y_t\)` is the same as `\(k_{t+1} \geq 0\)`: the household cannot borrow

--

Consider the deterministic case: no shocks, `\(\delta_1 \equiv 0\)`, and write `\(f(k) \equiv f_l(\alpha, k \mid N)\)`.

Consuming one unit less at `\(t\)`:

- lowers utility today by `\(u'(c_t)\)`

- raises `\(k_{t+1}\)` by `\(1+\delta_0\)` — and each unit of `\(k_{t+1}\)` adds `\(1 + f'(k_{t+1})\)` to cash on hand at `\(t+1\)`

--

On an optimal path with `\(k_{t+1} &gt; 0\)`, the **Euler equation** holds:

`$$u'(c_t) = \beta\,(1+\delta_0)\,\big[1+ f'(k_{t+1})\big]\, u'(c_{t+1})$$`

- if the no-borrowing constraint binds, `\(k_{t+1} = 0\)`, the left side can exceed the right

???

Derivation: with cash on hand x_t = k_t + f(k_t) and k_{t+1} = (x_t - c_t)(1 + delta_0), a unit of consumption given up at t becomes 1 + delta_0 units of capital at t+1; each of those is worth the asset itself plus the income it produces, 1 + f'(k_{t+1}), in cash on hand, valued at beta u'(c_{t+1}). At an interior optimum the marginal cost and the discounted marginal benefit are equal. The deterministic case is enough for the intuition; shocks then move households around the steady state derived next.

---

# Solving the model: the steady state

A **steady state** is a capital level `\(k^*\)` with `\(k_{t+1} = k_t = k^*\)`.

--

- then consumption is also constant, `\(c_{t+1} = c_t = c^*\)`, so `\(u'(c_t) = u'(c_{t+1}) &gt; 0\)`

- dividing both sides of the Euler equation by it:

`$$f'(k^*) = \rho, \qquad \rho \equiv \frac{1}{\beta(1+\delta_0)} - 1$$`

- `\(\rho\)` is the household's required return: impatience, net of the natural growth of capital

--

- with `\(f\)` strictly concave and satisfying the Inada conditions, exactly one `\(k^*\)` solves this

- if `\(k_t &lt; k^*\)`, then `\(f'(k_t) &gt; \rho\)`: the optimal path accumulates, and converges monotonically to `\(k^*\)`

- if `\(k_t &gt; k^*\)`, then `\(f'(k_t) &lt; \rho\)`: the household runs capital down, again toward `\(k^*\)`

???

Assume beta(1 + delta_0) &lt; 1, so that rho &gt; 0. The convergence result is the standard one for the one-sector growth model with a strictly concave technology: the optimal policy k_{t+1} = g(k_t) is increasing, lies above the 45-degree line below k* and below it above k*, so capital moves monotonically toward the unique steady state. This is conditional convergence: every household converges, but to a level set by its own alpha and by N_t.

---

# The steady state and capabilities

With `\(\alpha\)` back in, the steady state `\(k^*_l(\alpha \mid N_t)\)` solves `\(\dfrac{\partial f_l(\alpha, k^*_l)}{\partial k} = \rho\)`.

--

By the implicit function theorem:

`$$\frac{d k^*_l}{d\alpha} = -\,\frac{\partial^2 f_l / \partial k\, \partial \alpha}{\partial^2 f_l / \partial k^2} \; &gt; \; 0$$`

- the numerator is positive: capabilities and capital are **complements**

- the denominator is negative: `\(f_l\)` is **concave** in `\(k\)`

--

- steady-state income `\(f_l(\alpha, k^*_l(\alpha))\)` therefore rises with `\(\alpha\)`; `\(\alpha_0\)` solves `\(f_l(\alpha_0, k^*_l(\alpha_0)) = y^p\)`

- households with `\(\alpha &lt; \alpha_0\)` stay below the poverty line in steady state — whatever capital they start with

--

.takeaway[The solution is a steady-state curve, k*(α), rising in α — compare it with the poverty line]

???

Steady-state income rises with alpha for two reasons: directly, because f_l is increasing in alpha, and indirectly, because k*_l rises with alpha and f_l is increasing in k. So there is a single capability level alpha_0 at which steady-state income equals the poverty line; this is where the steady-state curve crosses the poverty locus y^p(alpha, k) in the single-equilibrium figure.

---

# Solving the model with two technologies

With `\(y = \max[f_l, f_h]\)` and `\(f_h &gt; f_l\)` only for `\(k &gt; \hat{k}\)`, output is **not concave** in `\(k\)`.

--

- the steady-state condition can be met on each branch: `\(\partial f_l/\partial k = \rho\)` at `\(k^*_l\)`, and `\(\partial f_h/\partial k = \rho\)` at `\(k^*_h\)`

- without concavity, the Euler equation is **necessary but not sufficient**: it no longer pins down one path

--

- reaching `\(k^*_h\)` means consuming less while capital is below `\(\hat{k}\)` and earns only the low return

- this pays off only if the household starts with enough capital, given its capabilities

- the **Micawber frontier** `\(M(\alpha, k)\)`: the boundary above which households accumulate toward `\(k^*_h\)`

--

.takeaway[Which steady state a household reaches can depend on where it starts — a multiple-equilibrium trap]

???

The high-technology steady state exists when k*_h lies above k-hat (otherwise the high technology is never worth running at its own steady state). The comparison between the two candidate paths is a comparison of lifetime utilities: the path toward k*_h requires a period of low consumption while capital is below k-hat and earns only the low-technology return. For households with very high alpha this sacrifice always pays, so they head to the high steady state from any starting capital; for very low alpha it never does. For the middle group it pays only from starting points close enough to k-hat, which is the region above the Micawber frontier. With shocks, households above the frontier reach the high equilibrium only probabilistically. The precise characterization is in Barrett, Carter, and Chavas (2019) and the Ikegami et al. chapter.
