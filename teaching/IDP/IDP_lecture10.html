# Opening question

A farmer in rural India has rice straw left after harvest. She has two options:

--

.pull-left[
**Option A: Burn the straw**
- Free and fast
- Clears field for next planting
- But it produces heavy smoke...
]

.pull-right[
**Option B: Use machines**
- Costs money and time
- Better for air quality
- But she cannot afford it
]

&lt;div style="clear: both;"&gt;&lt;/div&gt;

--

&lt;br&gt;

Every year, crop-burning smoke worsens air pollution in Delhi and across north India.

.small[Estimated toll: 44,000–98,000 premature deaths a year across India (Lan et al. 2022, *Nature Communications*).]

---

]

# What is sustainable development?

&gt; **Sustainable development** is development that meets the needs of the present without compromising the ability of future generations to meet their own needs.

.small[World Commission on Environment and Development (the Brundtland Commission), *Our Common Future*, 1987.]

--

&lt;br&gt;

**Three dimensions to balance** (UN Sustainable Development Goals, 2015): economic growth, social inclusion, and environmental protection.

--

&lt;br&gt;

.content-box-yellow[
**Today, two versions of the problem:** costs pushed onto other people (her smoke, Parts 1–3) and onto future generations (climate change, Part 4).
]

# Part 1

&lt;div style="font-size: 22px; margin-top: 10px;"&gt;
Why does she burn?
&lt;/div&gt;

---

# The smoke is an externality

&gt; An **externality** occurs when one person's actions have a **direct**, **unintentional**, and **uncompensated** effect on others.

--

&lt;br&gt;

**The farmer's smoke:**
- **Direct:** it reaches people's lungs, not through any market
- **Unintentional:** she burns to clear her field, not to harm anyone
- **Uncompensated:** no one downwind is paid for the harm

--

&lt;br&gt;

**Other examples:** a factory dumps waste in a river (negative); your vaccination also protects others (positive).

---

# The farmer's choice

&lt;div style="text-align: center;"&gt;
  &lt;img src="figures/farmer_burn_step1.png" style="width: 100%; max-width: 560px;" /&gt;
&lt;/div&gt;

- **Her benefit** (her *marginal benefit*): what burning one more acre saves her compared with hiring machines
- **Her cost** (her *private marginal cost*): her own cost of burning one more acre, close to zero
- She burns up to `\(Q_F\)`, where her benefit equals her cost: almost all her straw

.small[Illustrative graph.]

---

# Adding the cost to others

&lt;div style="text-align: center;"&gt;
  &lt;img src="figures/farmer_burn_step2.png" style="width: 100%; max-width: 560px;" /&gt;
&lt;/div&gt;

- **Damage to others** (*marginal damage*): the health harm to people downwind from one more acre
- **Cost to society** (*social marginal cost*) = her cost + the damage to others

---

# Too much burning

&lt;div style="text-align: center;"&gt;
  &lt;img src="figures/farmer_burn_step3.png" style="width: 100%; max-width: 560px;" /&gt;
&lt;/div&gt;

- **Best for society:** `\(Q^*\)`, where her benefit equals the cost to society
- She burns up to `\(Q_F\)` because she does not pay for the damage
- **Shaded area:** the extra burning saves her less than it costs society

---

# Your turn: An externality from home

**Think (2 minutes):** Write down one externality in your country.

1. Who causes it?
2. Who bears the cost?
3. Why has it not been solved?

--

**Pair (3 minutes):** Share it with a neighbor, ideally from another country.

--

**Share:** A few examples with the class.

---

# Why does the market fail here?

**1. Poorly defined property rights**
- Who owns Delhi's air? No one, so no one can charge her for polluting it

--

**2. High transaction costs**
- **Transaction costs:** the time and money needed to reach and enforce a deal
- Millions of people downwind cannot negotiate with each farmer

--

**3. Clean air is a public good**
- **Non-rival:** one person breathing clean air leaves just as much for others
- **Non-excludable:** no one can be stopped from breathing it
- **Free-rider problem:** people who can benefit without paying have no reason to pay, so too little is supplied

--

.content-box-yellow[
**Your examples:** Which of these three causes apply to the problem you discussed?
]

# Part 2

&lt;div style="font-size: 22px; margin-top: 10px;"&gt;
What can governments do?
&lt;/div&gt;

---

# How governments respond: Three tools

| Tool | The idea | Example |
|---|---|---|
| **Command&amp;#8209;and&amp;#8209;control** | Rules on what polluters must (not) do | Brazil: keep 80% of Amazon land as forest |
| **Emission tax** | A fee for each unit of pollution | Sweden's carbon tax, since 1991 |
| **Cap-and-trade** | A pollution cap; firms trade permits | Korea's emissions trading system, since 2015 |

--

.content-box-yellow[
**All three need a government that can monitor polluters and enforce the rules** — often the weak point in poor countries.
]

---

# India's response to crop burning

**Rules and subsidies:**
- 2015: Burning is banned and punishable by fines
- Since 2018: Subsidies (50–80% of the cost) for machines that remove straw

--

**But enforcement lags behind the rules:**

--

- Farmers are a powerful political group, so fines are weakly enforced
- Subsidies do not cover full equipment costs
- Smoke crosses state borders: the harm falls on other states, so few want to enforce

---

class: tipwide

# Gujarat: Why do nearly all plants pass their audits?

.pull-left[
Does enforcement work when a monitoring system exists? Evidence from factories:

**Gujarat, India:** plants hired and paid their own pollution auditors (Duflo, Greenstone, Pande &amp; Ryan 2013)

- **Auditors' reports:** 73% of plants just below the legal limit; 7% above it
- **Independent re-checks:** 19% just below the limit; 59% above it

.content-box-green[
**How would you redesign the system?**
]
]

.pull-right[
&lt;img src="figures/teaser_gujarat_audits.png" style="width: 100%; max-width: 380px;" /&gt;&lt;br&gt;
.small[**In this figure:** particulate matter at plants under the usual system; line = legal limit; gray = within 25% below it.]
]

---

# Gujarat: Making the auditors independent

**An RCT with 473 plants:** for half of them, the regulator changed the rules for auditors.

- Each plant was assigned an auditor at random
- Auditors were paid a fixed fee from a central fund, not by the plant
- 20% of their readings were re-checked without warning
- In the second year, their pay depended on how accurate they were

--

**Results:**
- Auditors were 80% less likely to falsely report a reading as within the limit
- Treated plants reduced their emissions, especially the most polluting ones

--

.content-box-yellow[
**Monitoring works only if the people who check have an incentive to report accurately.**
]

# Part 3

&lt;div style="font-size: 22px; margin-top: 10px;"&gt;
Can paying her work?
&lt;/div&gt;

# Payment for Ecosystem Services (PES)

**Instead of punishing harmful behavior, reward good behavior.**

People or communities are paid for actions that protect nature — similar to a conditional cash transfer (Week 6).

.small[Also called payment for *environmental* services, the term in the textbook.]

--

&lt;div style="display: flex; justify-content: center;"&gt;
&lt;iframe width="750" height="380" src="https://www.youtube.com/embed/gzNWnREZ2xI?si=wdmKelbk9KgzfS6p&amp;amp;start=8" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen&gt;&lt;/iframe&gt;
&lt;/div&gt;

---

# Predict: Paying farmers not to burn

**Study:** [Jack, Jayachandran, Kala &amp; Pande](https://www.nber.org/digest/20232/paying-indian-farmers-not-burn-agricultural-residue) — RCT in 171 villages in Punjab, India (2019 rice season)

--

Farmers were offered a payment per acre if they did not burn their rice straw. Two contracts:

- **Standard:** all of the money paid after the field was checked
- **Upfront:** part of the money paid upfront, unconditionally; the rest after the check

--

.content-box-green[
**Predict:** Which contract reduced burning? Why might the timing of payment matter?
]

---

# Results: Paying farmers not to burn

- **Standard contract:** 8.5% of farmers complied, but burning was no lower than without any payment (most of them would not have burned anyway)
- **Upfront contract:** 18% complied

--

**Why timing matters (the authors' explanation):**
- Farmers need cash at harvest time to clear straw without burning
- Some farmers do not trust a promise of payment later

--

.content-box-yellow[
**Even with an upfront payment, most farmers still burned.**
]

---

# PES elsewhere: Forests in Uganda

**RCT in 121 villages** ([Jayachandran et al. 2017](https://www.science.org/doi/10.1126/science.aan0568))

In 60 villages, forest owners were offered about US$28 per hectare a year to keep their forest.

&lt;div style="text-align: center;"&gt;
  &lt;img src="figures/jaya3.png" style="width: 100%; max-width: 420px;" /&gt;&lt;br&gt;
  &lt;small&gt;Source: &lt;a href="https://poverty-action.org/testing-effectiveness-payments-ecosystem-services-enhance-conservation-uganda"&gt;Innovations for Poverty Action&lt;/a&gt;&lt;/small&gt;
&lt;/div&gt;

**In this figure:** Tree cover fell 9.1% in control villages but only 4.2% in program villages.

.small[The benefit of delayed CO₂ emissions was about 2.4 times the program's cost.]

---

class: compact

# When does PES work?

**Conditions for success:**

| Factor | Why it matters |
|--------|----------------|
| Clear property rights | Need to know who should receive payments |
| Ability to monitor | Must verify that conservation takes place |
| Payments &gt; opportunity costs | Must pay more than people give up (e.g., timber income) |
| Low transaction costs | Administering payments must be feasible |

--

**It can also fail:**
- Paying people may crowd out their own motivation to protect nature
- What works in Uganda may not work elsewhere (external validity, Week 5)

--

.content-box-yellow[
**The farmer:** her field is hers and burning can be checked, but the payment must exceed what burning saves her, and paying every farmer in Punjab each season is costly to administer.
]

---

# Climate change: Unequal contributions

Most low-income countries emit very little CO₂ per person. **Your turn:** find your country. How does it compare with Korea?

&lt;iframe src="https://ourworldindata.org/grapher/co-emissions-per-capita?tab=map&amp;time=2023" loading="lazy" style="width: 100%; height: 480px; border: 0px none;" allow="web-share; clipboard-write"&gt;&lt;/iframe&gt;

---

# Climate change: Unequal impacts

&lt;div style="text-align: center;"&gt;
  &lt;img src="figures/econproductionhet.png" style="width: 100%; max-width: 700px;" /&gt;&lt;br&gt;
  &lt;small&gt;Source: Burke, Hsiang &amp; Miguel (2015)&lt;/small&gt;
&lt;/div&gt;

--

**In this figure:** Red = 1°C of warming lowers yearly growth; blue = it raises growth.

Already-hot countries, many of them poor, lose the most.

---

# Climate mitigation vs. adaptation

**Mitigation:** Reduce the cause of climate change

--

- Reduce greenhouse gas emissions
- Increase carbon absorption (forests, technology)
- Requires global cooperation

--

**Adaptation:** Reduce the harm from climate change

--

- Build sea walls for rising sea levels
- Develop drought-resistant crops
- Improve early warning systems
- Relocate vulnerable communities

--

&lt;br&gt;

.content-box-green[
**Both are needed** — mitigation to limit future warming, adaptation to cope with changes already under way.
]

---

# Climate cooperation: Where do we stand? (1/2)

&lt;div style="text-align: center;"&gt;
&lt;iframe width="800" height="450" src="https://www.youtube.com/embed/B11kASPfYxY?si=gFVmhNEfe6V6tWoB" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen&gt;&lt;/iframe&gt;

# Climate cooperation: Where do we stand? (2/2)

&lt;div style="text-align: center;"&gt;
&lt;iframe width="800" height="450" src="https://www.youtube.com/embed/qfAeoBGS3Ek?si=EjIzvr8uzsGM6EKn" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen&gt;&lt;/iframe&gt;
&lt;/div&gt;

---

# Why is climate cooperation so hard?

- **Free riding:** every country gains when others cut emissions, even if it does not — the public good problem from Part 1, now between countries

--

- **Costs now, benefits later:** cutting emissions costs money today; most benefits come decades later

--

- **Who should pay?** Rich countries caused most past emissions; poor countries want to grow now

--

- **No enforcement:** no global government; the Paris Agreement has no penalties for missing pledges

--

- **Withdrawal is easy:** the US announced its withdrawal in 2017 and again in 2025

---

# Main takeaways

**Sustainable development:** growth today should not push its costs onto other people or future generations.

--

**Crop burning is an externality:** the farmer ignores the health cost her smoke imposes on others.

--

**Markets fail** when property rights are unclear, agreements are costly to reach, or the good (clean air) is public.

--

**Governments can use** rules, taxes, or tradable permits, but all three need monitoring and enforcement.

--

**In developing countries,** enforcement is often weak, as in India's burning ban and Gujarat's audits.

--

**Paying for good behavior (PES)** can work: it halved tree loss in Uganda; in Punjab, only upfront payments helped.

--

**Climate change:** poor countries emit the least but face some of the largest risks.

--

**International cooperation** is essential but hard: free riding, short-term thinking, who pays, weak enforcement.

# This week's vocabulary (1/2)

**Externalities**

- **Externality** — an action's side effect on others, with no payment for the harm (or benefit)
- **Marginal benefit** — the benefit from one more unit (e.g., one more acre burned)
- **Marginal damage** — the harm to others from one more unit
- **Social marginal cost** — the private cost plus the damage to others

**Why markets fail**

- **Property rights** — the right to own and control a resource (e.g., clean air)
- **Transaction costs** — the time and money needed to reach and enforce a deal
- **Public good** — non-rival and non-excludable (e.g., clean air)
- **Free-rider problem** — people enjoy a good without paying, so too little of it is provided

---
class: vocab

# This week's vocabulary (2/2)

**Development and the environment**

- **Sustainable development** — meeting today's needs without harming future generations' ability to meet theirs

**Policy tools**

- **Command-and-control** — rules that tell firms or people what they must (not) do
- **Emission tax** — a fee for each unit of pollution
- **Cap-and-trade** — a limit on total pollution, with permits that firms can buy and sell
- **Payment for ecosystem (or environmental) services (PES)** — paying people for actions that protect nature
- **Opportunity cost** — what you give up by choosing one option (e.g., timber income)

**Climate change**

- **Mitigation** — reducing the causes of climate change (e.g., cutting emissions)
- **Adaptation** — reducing the harm from climate change (e.g., drought-resistant crops)

      if (cls.indexOf('inverse') === -1 || cls.indexOf('title-slide') !== -1) continue;
      if (!(cls.indexOf('middle') !== -1 && cls.indexOf('center') !== -1)) continue;
      var h = content.querySelector('h1, h2');
      var label = ((h ? h.textContent : content.textContent) || '').replace(/\s+/g, ' ').trim();
      label = label.replace(/\d+\s*\/\s*\d+\s*$/, '').trim();  /* strip slide number */
      if (!label) continue;
      if (label.length > 70) label = label.substring(0, 67) + '...';
      if (/^(questions|thank|do you have any)/i.test(label)) continue;
      if (seen[label]) continue;   /* incremental builds repeat the same slide */
      seen[label] = true;
      var a = document.createElement('a');
      a.href = '#' + (i + 1);
      a.textContent = label;
      list.appendChild(a);
      count++;
    }
    if (count === 0) { menu.style.display = 'none'; }
  }

  function init() {
    if (typeof slideshow === 'undefined') { setTimeout(init, 150); return; }
    buildMenu();
    var bar = document.getElementById('progress-bar');
    var n = slideshow.getSlideCount();
    slideshow.on('showSlide', function(slide) {
      bar.style.width = (100 * (slide.getSlideIndex() + 1) / n) + '%';
    });
    bar.style.width = (100 * (slideshow.getCurrentSlideIndex() + 1) / n) + '%';
  }
  init();
})();
</script>

        code.outerHTML = code.innerHTML;  // remove <code></code>
