# Opening exercise

### Think about your own consumption:
]

Yesterday, how many meals did you eat that included **rice**?

--

Can you estimate the total amount (in grams, cups, or bowls)?

--

--

What about the **last 30 days**? Or the **last 12 months**?

--

&lt;br&gt;

.content-box-green[
This is exactly the challenge faced when collecting poverty data from households worldwide.
]

class: inverse, middle, center

# Why Data Matters

---

# Data answers the key questions

To design effective poverty policies, we need to answer:

--

- **Who** is poor?

--

- **How poor** are they?

--

- **Where** do they live?

--

- **What** are their characteristics?

--

&lt;br&gt;

Without reliable data, poverty reduction efforts are based on guesswork rather than evidence.

--

Household surveys provide the detailed information needed to measure poverty, track progress, identify vulnerable groups, and allocate resources efficiently.

---

# Development data can be surprisingly fragile

In 2010, Ghana **rebased** its GDP — updating the base year and methods used to calculate it.

--

.content-box-yellow[
Overnight, Ghana's economy became **60% larger** — and moved from low-income to lower-middle-income status.
]

--

Nigeria's 2014 rebasing added **89%**, making it Africa's largest economy overnight.

--

&lt;br&gt;

Numbers like these determine **aid eligibility, debt ratios, and poverty counts** — yet they rest on surveys and statistical systems that are often underfunded.

--

.small[Read more: Morten Jerven, &lt;a href="https://www.cornellpress.cornell.edu/book/9780801478604/poor-numbers/"&gt;&lt;em&gt;Poor Numbers: How We Are Misled by African Development Statistics&lt;/em&gt;&lt;/a&gt; (2013)]

---

class: inverse, middle, center

# How Data Is Collected

---

# Household surveys

The primary method for collecting poverty data is **household surveys**.

--

Selected households are interviewed about their living conditions, including:
- Food consumption
- Housing and utilities
- Education and healthcare
- Asset ownership

--

&lt;br&gt;

Surveys use **sampling methods** to represent the entire population without surveying everyone.

---

# Sampling methods

&lt;div style="text-align: center;"&gt;
&lt;iframe width="800" height="450" src="https://www.youtube.com/embed/pTuj57uXWlk?si=PhOwlESBdMtm8rjR&amp;amp;start=3" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen&gt;&lt;/iframe&gt;
&lt;/div&gt;

---

# Common sampling approaches

**Stratified sampling**
- Population divided into groups (strata) by region, urban/rural, etc.
- Random sample drawn from each stratum

--

**Cluster sampling**
- Population divided into clusters (villages, districts)
- Random sample of clusters selected, then households within clusters surveyed

--

**Multistage sampling**
- Combines stratification and clustering
- First select clusters, then households within clusters

--

&lt;br&gt;

Data quality depends on careful survey design and trained enumerators.

---

# Challenges in Data Collection

---

class: tipwide

# Recall bias

Respondents may forget or misreport consumption, especially with longer recall periods.

--

.pull-left[
**The trade-off:**

- Shorter periods → better recall, but may not reflect typical consumption

- Longer periods → more representative, but more forgetting
]

.pull-right[
&lt;img src="figures/food1.png" style="width: 100%; max-width: 600px;" /&gt;
]

--

.pull-left[
&lt;br&gt;

**In this figure:** naïve annual extrapolation from one month of data nearly doubles measured hunger (26% vs. 14%).
]

---

# Seasonality and timing

Consumption varies by season, time of month, and day of week.

&lt;div style="text-align: center;"&gt;
  &lt;img src="figures/food2.png" style="width: 100%; max-width: 1100px;" /&gt;
&lt;/div&gt;

**In this figure:** measured consumption in Mongolia is higher in December and on weekends, lower late in the month.

--

So a single survey visit may not capture typical consumption patterns.

---

# Other measurement challenges

**Measurement errors**
- Difficulty estimating quantities accurately
- Converting local units (pails, bunches) to standard measures (kg, liters)

--

**Social desirability bias**
- Respondents may over- or under-report due to perceived expectations or stigma

--

**Respondent variation**
- Different household members may give different answers
- Intra-household food sharing is hard to track

--

**Complex questionnaires**
- Technical terms may confuse respondents

--

.small[Read more: &lt;a href="https://documents1.worldbank.org/curated/en/793601587034078451/pdf/Food-Data-Collection-in-Household-Consumption-and-Expenditure-Surveys-Guidelines-for-Low-and-Middle-Income-Countries.pdf"&gt;World Bank Food Data Collection Guidelines&lt;/a&gt;]

---

# These challenges extend beyond food

Non-food spending uses **different recall windows** — one week for frequent items, one month for toiletries:

&lt;div style="text-align: center;"&gt;
  &lt;img src="figures/malawi2.png" style="width: 100%; max-width: 800px;" /&gt;
&lt;/div&gt;

---

# These challenges extend beyond food

Rarer purchases like clothing use a **three-month recall** — longer windows cover more purchases, but invite more forgetting:

&lt;div style="text-align: center;"&gt;
  &lt;img src="figures/malawi3.png" style="width: 100%; max-width: 800px;" /&gt;
&lt;/div&gt;

---

# Why surveys still matter

Household consumption aggregates many components — food, non-food items, durable goods, housing.

--

When each component has measurement errors, these **errors can accumulate**.

--

Despite these challenges, household surveys remain **the global standard** for assessing poverty and well-being.

--

They provide **detailed information** that underpins poverty measurement, policy design, and impact evaluation.

--

&lt;br&gt;

.content-box-yellow[
**Key point:** Understanding the limitations helps us interpret data with appropriate caution — while recognizing its indispensable value.
]

---

class: inverse, middle, center

# What Does the Data Look Like?

---

# Cleaned household data

From raw survey responses, researchers create cleaned datasets with computed variables.

--

Here's an example from Mexican household surveys:

&lt;div style="text-align: center;"&gt;
  &lt;img src="figures/household_data.png" style="width: 100%; max-width: 1000px;" /&gt; 
&lt;/div&gt;

--

Each row represents a **household** in a particular **year**.

---

# Key variables in household data

| Variable | Description | Type |
|----------|-------------|------|
| Household_ID | Unique identifier | ID |
| year | Survey year | Categorical |
| hhsize | Number of household members | Continuous |
| inc_pc | Per capita income (2004 pesos) | Continuous |
| hhfemale | Female-headed household (0/1) | Binary |
| hh_school | Head's education level | Categorical |
| region | Geographic region | Categorical |

--

&lt;br&gt;

If we observe the same households over multiple years, we have a **panel dataset**.

---

# Three types of variables

--

**Binary (dummy) variable** — takes only two values: 1 ("yes") or 0 ("no")

- Example: `hhfemale` = 1 if the household head is female, 0 otherwise
- The mean of a dummy is a **proportion**: mean of 0.28 → 28% of households are female-headed

--

**Categorical variable** — a limited set of categories, often with no natural ordering

- Example: `region` (North, Central, South) or `hh_school` (education levels)
- Categories are stored as numbers, but the numbers are just labels

--

**Continuous variable** — numeric values on a scale; can take (almost) any value

- Example: `inc_pc` (income per capita) or `hhsize` (household members)
- Means, differences, and comparisons have direct numeric meaning

---

class: inverse, middle, center

# Computing Poverty Measures

---

# From data to poverty indicators

Recall from last week: we need a **poverty line** to classify households as poor or non-poor.

--

Mexico uses separate poverty lines for **urban** and **rural** households:

&lt;div style="text-align: center;"&gt;
  &lt;img src="figures/household_data3.png" style="width: 100%; max-width: 850px;" /&gt; 
&lt;/div&gt;

---

# Creating a poverty indicator

We compare each household's consumption to the relevant poverty line:

- **poor = 1** if consumption is below the poverty line; **poor = 0** otherwise.

&lt;div style="text-align: center;"&gt;
  &lt;img src="figures/household_data4.png" style="width: 100%; max-width: 850px;" /&gt; 
&lt;/div&gt;




---

# Computing the headcount ratio

The poverty headcount ratio `\((P^0)\)` is simply the **mean** of the poverty indicator:

`$$P^0 = \frac{\text{Number of poor households}}{\text{Total households}} = \text{mean(poor)}$$`

--

In Stata:
```stata
summarize poor
```

&lt;div style="text-align: center;"&gt;
  &lt;img src="figures/summary.png" style="width: 100%; max-width: 600px;" /&gt; 
&lt;/div&gt;

--

.content-box-green[
**Key insight:** The mean of a 0/1 variable gives you a proportion.
]

---

# Other poverty indicators

**Poverty gap** `\((P^1)\)`: Average shortfall from the poverty line

`$$P^1 = \frac{1}{n}\sum_{i=1}^{q}\frac{z - y_i}{z}$$`

--

**Poverty severity** `\((P^2)\)`: Emphasizes deeper poverty (squared gaps)

`$$P^2 = \frac{1}{n}\sum_{i=1}^{q}\left(\frac{z - y_i}{z}\right)^{2}$$`

--

&lt;br&gt;

All indicators are computed as **means** of different variables derived from household consumption relative to the poverty line.

--

You'll practice computing these in **Problem Set 1** and **TA sessions**.

---

# From surveys to policy: Targeting

Household survey data isn't just for measurement — it decides **who receives help**.

--

Many programs select beneficiaries by **proxy means testing** — predicting a household's welfare from visible, easy-to-verify survey variables (housing materials, assets, household size).

--

With imperfect data, targeting makes two kinds of mistakes:

- **Exclusion error** — a truly poor household is screened out and misses the transfer

- **Inclusion error** — a non-poor household is wrongly included

--

.content-box-green[
**Key point:** Data quality is not a technicality — it determines who gets help. We'll return to targeting when we discuss social assistance programs.
]

---

# Introduction to Stata

&lt;div style="font-size: 20px; margin-top: 10px;"&gt;
&lt;/div&gt;

---

# What is Stata?

Stata is statistical software widely used in economics and development research.

--

**Why Stata?**

- User-friendly command syntax
- Handles large datasets efficiently
- Supports reproducibility through do-files (scripts)
- Extensive built-in statistical functions
- Standard tool for analyzing household surveys

---

# Stata interface

&lt;div style="text-align: center;"&gt;
  &lt;img src="figures/stata.png" style="width: 100%; max-width: 950px;" /&gt; 
&lt;/div&gt;

---

# Key components

| Window | Purpose |
|--------|---------|
| **Command** | Type and run commands |
| **Results** | View output |
| **Variables** | Browse dataset variables |
| **Review** | See command history |
| **Do-file Editor** | Write and save scripts |

--

&lt;br&gt;

You'll become familiar with these during TA sessions.

---

# Typical Stata workflow

1. **Import data**: Load from CSV, Excel, or .dta files

2. **Explore**: Summarize variables, check for missing data

3. **Clean**: Create/modify variables, handle missing values

4. **Analyze**: Run statistics, compute poverty measures

5. **Visualize**: Create graphs and charts

6. **Document**: Save do-files and log files for reproducibility

--

&lt;br&gt;

**Resource:** &lt;a href="https://www.youtube.com/watch?v=gdnDkjoPJTM"&gt;Introduction to Stata (YouTube)&lt;/a&gt;

**Sample Do-file:** stata_practice_dofile

---
class: vocab

# This week's vocabulary (1/2)

**Collecting data**

- **Household survey** — interviews with selected households about consumption and living conditions
- **Stratified / cluster / multistage sampling** — sampling by population groups, by locations, or in stages
- **Enumerator** — the trained interviewer who administers the survey

**Measurement challenges**

- **Recall bias** — respondents forget or misreport; worse over longer recall periods
- **Seasonality** — consumption varies over the year, so survey timing matters
- **Social desirability bias** — answers shaped by what feels acceptable to report
- **Measurement error** — mistakes from estimating quantities and converting local units

---
class: vocab

# This week's vocabulary (2/2)

**Working with data**

- **Panel dataset** — the same households observed over multiple years
- **Binary (dummy) / categorical / continuous variables** — 0/1 indicators, categories, numeric measures
- **Do-file** — a saved Stata script that makes your analysis reproducible

**From data to policy**

- **Proxy means test** — predicting household welfare from visible characteristics to target programs
- **Inclusion / exclusion errors** — helping the wrong households vs. missing the truly poor

---
