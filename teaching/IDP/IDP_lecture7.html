# Opening question

A 14-year-old girl in rural Mexico faces a choice:

--

.pull-left[
**Option A: Stay in school**
- Continue to 9th grade
- No immediate income
- Maybe get a better job later?
]

.pull-right[
**Option B: Work in a factory**
- Earn $5/day starting now
- Help family pay bills immediately
- But what about the future?
]

--

&lt;br&gt;

Understanding Education

# Why does education matter?

Education is important for two reasons:

--

**1. Intrinsic value**

- People value learning for its own sake, not only for what it earns
- Being able to read, reason, and choose is part of what development means (Week 1)

--

**2. Instrumental value**

- Education increases productivity and wages
- More educated workers → economic growth
- Better health, civic participation, innovation

--

&lt;br&gt;

.content-box-green[
**Key insight:** Education benefits not just individuals but society as a whole.
]

# Education Indicators

&lt;div style="font-size: 20px; margin-top: 10px;"&gt;
How do we measure educational outcomes?
&lt;/div&gt;

---

# Gross Enrollment Rate (GER)

**GER** measures total enrollment relative to the school-age population:

`$$GER = \frac{\text{All students enrolled at a level (any age)}}{\text{Children of official age for that level}} \times 100\%$$`

--

&lt;br&gt;

**Can GER be greater than 100%?**

--

Yes! Over-age (and under-age) students count in the numerator but not in the denominator. This happens when:

- Students repeat grades
- Students start school late (or early)

--

&lt;br&gt;

.content-box-yellow[
**A GER above 100% is often NOT a good sign** — it may indicate high grade repetition rates.
]

# Net Enrollment Rate (NER)

**NER** is stricter — it counts only children of the official age:

`$$NER = \frac{\text{Children of official age enrolled at that level}}{\text{Total children of official age}} \times 100\%$$`

--

&lt;br&gt;

**Can NER be greater than 100%?**

--

No — by definition, the numerator can't exceed the denominator.

--

&lt;br&gt;

.content-box-green[
**NER is generally a better indicator** of whether children are in school at the right time.
]

# Summary: Education indicators

| Indicator | What it measures | Limitation |
|-----------|------------------|------------|
| **GER** | Total enrollment / age-group population | Can exceed 100% (grade repetition) |
| **NER** | Correct-age enrollment / age-group | Misses over-age students |
| **Out-of-school** | Children not enrolled | Misses children enrolled but rarely attending |
| **Attainment** | Years of schooling completed | Doesn't measure learning |
| **Completion rate** | Who finishes each level | Doesn't measure learning |
| **Test scores** | Actual learning | Hard to compare across contexts |

--

&lt;br&gt;

.content-box-green[
**Key insight:** Enrollment ≠ Attendance ≠ Learning. We need multiple indicators.
]

# What Determines Schooling?

&lt;div style="font-size: 20px; margin-top: 10px;"&gt;
Why do some children go to school while others don't?
&lt;/div&gt;

---

# The schooling decision

Going to school is an **investment**: the family pays now and gains later.

--

.pull-left[
**Costs — paid now:**

- Fees, books, uniforms, transport
- Wages the child gives up (**opportunity cost**)
- Help the family loses at home
]

.pull-right[
**Benefits — mostly later:**

- Higher wages over a working life
- Better job opportunities
- Better health, more informed choices
- Enjoyment of learning (also now)
]

&lt;div style="clear: both;"&gt;&lt;/div&gt;

--

&lt;br&gt;

.content-box-green[
**Rule:** Stay one more year if its future benefits, valued **today**, exceed this year's costs.
]

---

# Why timing matters

**Back to the girl in the opening question.** If she stays in school, her family gives up her wages *this year*.

The higher wages come only once she starts working — and then spread over 40 years.

--

**Discounting:** a benefit that comes later is worth less today — how much less depends on the family's situation.

--

**What would make her family say no, even if the returns are high?**

--

**Poor families discount future benefits more heavily:**

- They cannot borrow against the child's future wages (a **credit constraint**)
- Today's needs are urgent: food, rent, debts
- The payoff is less certain: illness, or no jobs nearby

--

**In any family,** parents pay now, but the child earns later — and may not share it with them.

--

.content-box-yellow[
**Same school, same returns:** worth it for a richer family, maybe not for a poorer one.
]

.beside[
- **Cost** of one more year rises: older children give up more wages.
- **Benefit to society** falls: fewer working years remain to earn it back.
- Best for society: where benefit equals cost.
- The **family** counts only its own gains, not the gains to others: a **positive externality**.
- So it stops earlier. The gap is **under-investment**: years that pay off for society, not for the family.
- A **poor family** discounts the same future wages more heavily (no credit, urgent needs): it stops even earlier.
- A **subsidy or CCT** paid *now*, per year of school, lifts the family's line; one equal to the gap restores society's best.
]

# Why don't some children attend school?

In the graph: anything that raises the cost line or lowers the family's benefit line.

.pull-left[
**The costs are too high:**
- School fees, supplies, transport are unaffordable
- Family needs the child's labor or income
- Schools are too far away
- Safety concerns (especially for girls)
]

.pull-right[
**The benefits seem too low:**
- Poor school quality → limited learning
- Few job opportunities even with education
- Parents underestimate the returns to schooling
- Social norms against educating girls
]

&lt;div style="clear: both;"&gt;&lt;/div&gt;

--

&lt;br&gt;

.content-box-yellow[
**Policy can address each of these barriers** — that's what we'll explore in Session 2.
]

---

class: tipwide

# Returns to schooling: What's the payoff?

**Returns to schooling** = the % higher wages that go with one more year of school

.pull-left[
**In this table** (139 economies):

- One more year of school goes with **about 10% higher wages**
- Higher for women (11.7%) than for men (9.6%)

.small[Women's returns are estimated among women in paid work. N = household surveys. Source: Montenegro &amp; Patrinos (2014).]
]

.pull-right[
&lt;img src="figures/return.png" style="width: 100%; max-width: 450px;" /&gt;
]

&lt;div style="clear: both;"&gt;&lt;/div&gt;

--

**An association, not yet a causal effect (Week 4):** abler or richer children stay in school longer *and* earn more.

--

.content-box-green[
**A causal answer needs a change in schooling unrelated to ability** — Session 2: Duflo's Indonesia schools (Week 5).
]

---

# Why returns to schooling matter for policy

If returns are high but enrollment is low, something is preventing children from going to school.

--

**Possible barriers:**

| Barrier | Policy response |
|---------|-----------------|
| Families don't know returns are high | Information campaigns |
| Can't afford school costs | Subsidies, free schooling |
| Need child's income now | Cash transfers |
| No schools nearby | Build more schools |
| Schools are low quality | Teacher training, incentives |

--

.content-box-green[
**This is the framework for Session 2:** Matching policies to barriers.
]

---

# Session 1 summary

--

**Multiple indicators** measure education: enrollment (GER, NER), completion, attainment, and learning.

--

**Schooling is an investment:** costs come now, benefits later — and poor families weigh the future less.

--

**Families invest too little:** they ignore gains to others, and poor families cannot borrow against future wages.

--

**Returns to schooling are high:** one more year goes with ~10% higher wages — yet many children leave.

--

**Policy can help** by reducing costs, increasing benefits, or removing barriers.

--

&lt;br&gt;

**Next:** What specific policies work?

---

# Session 2

&lt;div style="font-size: 22px; margin-top: 10px;"&gt;
Policy Interventions
&lt;/div&gt;

---

# Two types of interventions

Policies to improve education can be classified as:

--

&lt;br&gt;

.pull-left[
**Supply-side interventions**

Increase the availability or quality of schools:
- Build more schools
- Hire more teachers
- Improve teacher quality
- Provide textbooks/materials
]

.pull-right[
**Demand-side interventions**

Make families more willing or able to send children:
- Reduce school costs
- Cash transfers
- Provide information about returns
- Address opportunity costs
]

--

&lt;br&gt;

.content-box-green[
**Both matter** — the best approach depends on what barriers exist in a given context.
]

---

class: inverse, middle, center

# Supply-Side Interventions

---

# Supply-side factors

&lt;div style="text-align: center;"&gt;
  &lt;img src="figures/supply1.png" style="width: 100%; max-width: 700px;" /&gt;
&lt;/div&gt;

.small[**In this table:** DD = difference-in-differences (Week 5). RDD compares classes just above and just below the 40-student cutoff.]

---

# Supply-side factors (continued)

&lt;div style="text-align: center;"&gt;
  &lt;img src="figures/supply2.png" style="width: 100%; max-width: 700px;" /&gt;
&lt;/div&gt;

.small[**Note:** In Muralidharan &amp; Sundararaman, the extra inputs went to a *separate* group of schools, not to the control group. Incentive schools did better than both.]

---

# Evidence: School construction in Indonesia

**Recall from Week 5:** Duflo (2001) studied Indonesia's huge school building program (1973–1978).

--

**The program:** More than 61,000 new primary schools — over one per 500 children aged 5–14.

--

**The challenge:** Schools went where many children were not enrolled — regions differed from the start.

--

**The solution:** Difference-in-differences

- Compare younger cohorts (aged 2–6 in 1974) vs. older cohorts (aged 12–17, too old to benefit)
- Across high-construction vs. low-construction regions

--

**Finding:** Each new school per 1,000 children → **+0.12–0.19 years** of school, **+1.5–2.7%** wages.

.small[The simple 2×2 table in Week 5 gave +0.11 years.]

--

**Back to Session 1:** the implied *causal* return is **6.8–10.6%** per extra year of school.

--

.content-box-green[
**Building schools works** — and schooling really does raise wages, close to the ~10% we saw.
]

---

# Evidence: Teacher incentives in India

**The problem:** Teachers are often absent — in India, about 25% on a typical school day.

--

**The question:** Can performance-based pay improve teacher effort and student learning?

--

**Study:** Muralidharan and Sundararaman (2011) — RCT in 500 rural schools in Andhra Pradesh, India (100 per group)

--

**Design:** Schools randomly assigned to:

| Group | Intervention |
|-------|--------------|
| **Individual incentives** | Teacher bonus based on *own students'* test score improvement |
| **Group incentives** | Teacher bonus based on the *whole school's* average improvement |
| **Control** | No bonus (status quo) |

.small[The average bonus was about 3% of a teacher's yearly pay. Absence figure: Kremer et al. (2005).]

---

# Results: Teacher incentives

**What happened?**

--

**Student learning improved:**

- After two years, test scores were higher in both math and language
- Scores also rose in subjects that had no bonus attached
- Both schemes worked equally well in year 1; individual bonuses did better in year 2

--

**But how? Teacher behavior:**

- Teacher absence did **not** fall, and classroom observers saw no difference
- Teachers *reported* more homework, extra classes, practice tests, and help for weaker students

--

&lt;br&gt;

.content-box-green[
**Teacher incentives can work** — but they need careful design (e.g., independent tests of all students).
]

---

class: inverse, middle, center

# Demand-Side Interventions

---

# Demand-side barrier: Opportunity costs

**Study:** [Atkin (2016) — Mexico](https://www.aeaweb.org/articles?id=10.1257/aer.20120901)

--

**Question:** What happens to schooling when new export-factory jobs open up (Mexico, 1986–2000)?

--

**Method:** Use variation in the **timing of factory openings across commuting zones**.

--

**Finding:** For every 25 new factory jobs, **one student dropped out** at grade 9 instead of finishing grade 12.

--

&lt;br&gt;

.content-box-yellow[
**When jobs for teenagers appear, some leave school** — staying in school now costs more (opportunity cost).
]

.small[In the graph from Session 1: the cost line shifts up, so the family stops earlier.]

--

&lt;br&gt; 

**Policy implication:** Cash transfers can offset this by compensating families for lost income.

---

# Demand-side barrier: Misperceptions about returns

**Study:** [Jensen (2010) — Dominican Republic](https://academic.oup.com/qje/article/125/2/515/1882172)

--

**The puzzle:**

- 80–90% of students complete primary school (8th grade)
- But only 25–30% complete secondary school (12th grade)

--

**Why?** Jensen asked 2,250 eighth-grade boys what they expected to earn:

| | Students believed | Measured in survey data |
|--|-------------------|----------------|
| **Gain from finishing secondary (vs. primary)** | ~9% higher earnings | ~41% higher earnings |
| **Return per year of secondary school** | ~2% | ~8% |

--

.content-box-yellow[
**Students dramatically underestimated the benefits of staying in school.**
]

---

# Can information change behavior?

**Jensen's experiment:**

--

| Group | Intervention |
|-------|--------------|
| **Treatment** (randomly chosen schools) | Told measured earnings: secondary graduates earn ~41% more |
| **Control** | No information (status quo) |

--

**Results:**

- Students who got the information completed **0.20 more years** of school over the next four years

--

**But the effects varied:**

- **Less poor students** (above median income): stayed in school longer (+0.33 years)
- **Poorer students:** beliefs rose just as much, but schooling didn't change — cost likely held them back

--

.content-box-green[
**Information helps, but only when families can act on it.** Poor families also need financial support.
]

---

# Demand-side solution: Cash transfers

**Recall from Weeks 5–6:** Conditional cash transfers (CCTs) pay families to send children to school.

--

**Mexico's PROGRESA program:**
- Pays poor rural mothers if children attend school (at least 85% of school days)
- Transfers increase with grade level (higher opportunity cost for older children)
- In secondary school, girls receive larger transfers than boys

--

**Why this design makes sense:**

| Design feature | Rationale |
|----------------|-----------|
| Transfers increase by grade | Offset higher opportunity costs for older children (the rising cost line) |
| Target poor households | Credit constraints bite hardest there (Session 1) |
| Focus on rural areas | Where extreme poverty was concentrated in 1997 |
| Higher transfers for girls | Girls' secondary enrollment was lower; parents expect less return from daughters |

---

# PROGRESA: What did it achieve?

**Recall Week 5:** PROGRESA started in randomly chosen communities in 1998; the others joined later.

--

So comparing early and late communities gives **causal** effects (Week 5: randomization).

--

**The question:** Did the cash keep children in school — especially at the move from primary to secondary?

--

&lt;br&gt;

.content-box-green[
**You will answer this yourselves with the PROGRESA data in Problem Set 2.**
]

--

**A general lesson:** cash helps only if there is a school to attend — demand and supply policies go together.

---

# Comparing interventions

| Intervention | What it addresses | Evidence |
|--------------|-------------------|----------|
| **Build schools** | Access/distance | Works where distance is the barrier; small gain per school |
| **Teacher incentives** | Quality | Can improve learning |
| **Information campaigns** | Misperceived returns | Helps those who can afford school |
| **Cash transfers** | Costs, incl. lost income | Raised attendance in Malawi (Week 6); PROGRESA: PS2 |
| **Free uniforms/supplies** | Direct costs | Can increase attendance |

.small[Recall Week 4's TED chart: per $100, information gave 40 extra years of school, CCTs only 0.02–0.09. But CCTs also reduce poverty today.]

--

.content-box-green[
**No single intervention is always best** — the right approach depends on what barriers exist locally.
]

---

# The policy design process

**Step 1:** Diagnose the problem
- Why aren't children in school in this context?
- Is it cost? Distance? Quality? Beliefs?

--

**Step 2:** Match intervention to barrier
- Cost barrier → Cash transfers, subsidies
- Distance barrier → Build schools
- Quality barrier → Teacher training, incentives
- Information barrier → Campaigns about returns

--

**Step 3:** Evaluate impact
- Use rigorous methods (RCTs, DiD) to measure what works
- Adjust based on evidence

--

.content-box-yellow[
**This is evidence-based policy** — the approach we've been learning throughout this course.
]

---

# Main takeaways

--

**Multiple indicators** measure education (enrollment, completion, learning); they don't always move together.

--

**Schooling decisions** weigh costs paid now against benefits that come later; poor families discount more.

--

**Families invest too little** — they ignore benefits to others and cannot borrow against future wages.

--

**Returns to schooling** are about 10% per year; Duflo's causal estimate for Indonesia is similar.

--

**Supply-side interventions** (schools, teachers) increase availability and quality.

--

**Demand-side interventions** (cash transfers, information) help families overcome barriers.

--

**Context matters** — the best policy depends on what barriers exist locally.

--

**Rigorous evaluation** is essential to know what works.

---
class: vocab

# This week's vocabulary (1/2)

**Measuring education**

- **Gross enrollment rate (GER)** — all students at a level ÷ children of official age; can exceed 100%
- **Net enrollment rate (NER)** — official-age students at a level ÷ children of official age
- **Completion rate** — share of children who finish a given level
- **Educational attainment** — average years of school completed by adults (25+)
- **Learning outcomes** — what students actually know, usually measured by tests

**The schooling decision**

- **Opportunity cost** — what a child gives up by being in school, e.g., wages from work
- **Discounting** — valuing a benefit that comes later less than the same benefit today
- **Returns to schooling (per year)** — % higher wages per extra year: ~10%; Indonesia causal: 6.8–10.6%

---
class: vocab

# This week's vocabulary (2/2)

**Why families invest too little**

- **Positive externality** — a benefit to others that the person deciding does not count
- **Credit constraint** — being unable to borrow now against future earnings
- **Under-investment** — less schooling than would be best for society

**Policy interventions**

- **Supply-side intervention** — more or better schools and teachers
- **Demand-side intervention** — helping families want, or afford, to send children to school
- **Perceived returns** — what students *believe* school pays; can differ from measured returns
- **Teacher performance pay** — teacher bonuses tied to students' test score gains
- **Heterogeneous effects** — a program's impact differs across groups (e.g., poorer vs. less poor)

---

2. Should cash transfers for education be conditional (require attendance) or unconditional? What are the trade-offs?
