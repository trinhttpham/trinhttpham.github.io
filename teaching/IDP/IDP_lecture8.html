# Opening question

In rural India, public health clinics are **free**.

--

Yet most people **pay out of pocket** to see private doctors.

--

Here's the puzzle:

--

.pull-left[
**Public clinics**
- Free services
- Government-funded
- Should serve the poor
]

.pull-right[
**Private "doctors"**
- Charge fees
- 41% have no medical degree
- Give injections at most visits; rarely test
]

&lt;style&gt;
.pull-left { width: 45%; margin-left: 2.5%; }
.pull-right { width: 45%; margin-right: 2.5%; }
&lt;/style&gt;

&lt;div style="clear: both;"&gt;&lt;/div&gt;

--

.content-box-green[
**Why would poor families pay for unqualified private care when free public care exists?**
]

--

Write down your guess — we'll come back to it. Today: what's broken in health systems, and what works to fix it.

# Health Indicators

&lt;div style="font-size: 20px; margin-top: 10px;"&gt;
How do we measure population health?
&lt;/div&gt;

---

# Life expectancy at birth

**Definition:** Average number of years a newborn would live if today's death rates at each age continued.

--

So it summarizes **today's** death rates; it is not a forecast. It is the most commonly used indicator of population health.

--

**Limitations:**
- Doesn't measure quality of life during those years
- Doesn't capture the WHO definition of "wellbeing"

--

&lt;br&gt;

Life expectancy has increased dramatically worldwide — but huge disparities remain.

---

# Health-adjusted life expectancy (HALE)

**HALE**: years a newborn can expect to live in full health — roughly, life expectancy minus years lived in poor health.

&lt;iframe src="https://ourworldindata.org/grapher/healthy-life-expectancy-at-birth?time=latest&amp;tab=map" loading="lazy" style="width: 100%; height: 500px; border: 0px none;" allow="web-share; clipboard-write"&gt;&lt;/iframe&gt;

---

# Infant mortality rate

**IMR**: deaths before age 1 per 1,000 live births. Babies are most vulnerable, so IMR reacts fast.

--

&lt;iframe src="https://ourworldindata.org/grapher/infant-mortality?tab=map" loading="lazy" style="width: 100%; height: 500px; border: 0px none;" allow="web-share; clipboard-write"&gt;&lt;/iframe&gt;

---

# Burden of disease (DALYs)

**DALYs**: healthy years lost to early death **plus** years lived with illness (1 DALY = 1 lost healthy year).

&lt;iframe src="https://ourworldindata.org/grapher/dalys-rate-from-all-causes?tab=map" loading="lazy" style="width: 100%; height: 500px; border: 0px none;" allow="web-share; clipboard-write"&gt;&lt;/iframe&gt;

# Hunger and malnutrition indicators

| Indicator | What it measures | Notes |
|-----------|------------------|-------|
| **Daily calorie intake** | Food consumption | Based on recall/diaries |
| **Micronutrient deficiencies** | Iron, zinc, vitamin A levels | Requires blood tests; "hidden hunger" |
| **Stunting** | Height-for-age | Reflects long-term/early malnutrition |
| **Wasting** | Weight-for-height | Reflects current nutritional status |
| **BMI** | Weight/height² | General nutritional status |

--

&lt;br&gt;

.content-box-green[
**Multiple indicators needed** — someone can have adequate calories but still suffer micronutrient deficiencies.
]

---

# Summary: Health indicators

The WHO defines health as "complete physical, mental, and social wellbeing" — so no single number captures it.

| Indicator | What it captures | Limitation |
|-----------|------------------|------------|
| **Life expectancy** | Overall mortality | Not quality of life |
| **HALE** | Healthy years lived | Complex to calculate |
| **Infant mortality** | Health conditions for babies | Only captures one age group |
| **DALYs** | Disease burden | Data-intensive |
| **Body measures** (height, weight) | Nutritional status | Doesn't capture all health dimensions |

--

&lt;br&gt;

.content-box-green[
**No single perfect measure** — use multiple indicators for a complete picture.
]

&lt;div style="font-size: 20px; margin-top: 10px;"&gt;
Why do health systems fail?
&lt;/div&gt;

# Case study: Health care in rural Rajasthan

**Study:** Banerjee, Deaton, and Duflo (2004)

**Setting:** Udaipur district, one of the poorest in India
- Large tribal population
- Unusually high female illiteracy
- 100 hamlets (small village settlements), 1,024 households surveyed

--

**Research questions:**
1. What is the health status of rural populations?
2. How do people access health care?
3. Why don't people use free public facilities?

--

&lt;br&gt;

.content-box-yellow[
**Although the data are from 2002-2003, the lessons remain highly relevant today.**
]

---

# Finding 1: Health status is poor

&lt;div style="text-align: center;"&gt;
  &lt;img src="figures/health1.png" style="width: 100%; max-width: 550px;" /&gt;
&lt;/div&gt;

**In this figure:** households split into thirds by spending — even the top third has poor health.

--

**Key findings:**
- **BMI:** 88% of women and 93% of men have BMI below 21 (average = 17.8)
- **Respiratory problems:** Average peak flow reading of 316 (below 350 signals breathing difficulty)
- **Anemia:** 56% of women and 51% of men are anemic

---

# Finding 2: People rarely use public facilities

&lt;div style="text-align: center;"&gt;
  &lt;img src="figures/health2.png" style="width: 100%; max-width: 360px;" /&gt;
&lt;/div&gt;

--

**Key findings:**
- Adults visit a health provider about once every two months (0.51 visits per month)
- **Most visits are to private providers**; fewer than 1 in 4 are to public facilities
- About 1 in 5 visits is to a *bhopa* (traditional healer)
- Surprisingly, **the poor use public facilities even less** than the non-poor

---

# Finding 3: Health is a major expense

&lt;div style="text-align: center;"&gt;
  &lt;img src="figures/health3.png" style="width: 100%; max-width: 440px;" /&gt;
&lt;/div&gt;

--

**Key findings:**
- Households spend about **7% of their budget** on health — and the poorest spend the same share
- Public care is **not really free**: for the poor, a public visit cost Rs 71 vs. Rs 84 for a private one
- A likely reason: public clinics don't always have free medicines, so patients buy them

--

.content-box-yellow[
**Back to your guesses from the opening question:** did anyone say "the free clinic isn't free"?
]

---

# The puzzle

**Why don't people use the free public health system?**

--

On paper, India has an ideal public health structure:

| Level | People served (study area) | Services |
|-------|----------|----------|
| **Sub-center** | ~3,600 (official rule: 1 per 3,000) | One trained nurse: first point of care |
| **Primary Health Center (PHC)** | ~48,000 | Doctors (1.5 on average): the next step |
| **Referral hospital** | Regional | Serious cases |

Official rule: centers open 6 days a week, 6 hours a day.

--

&lt;br&gt;

.content-box-yellow[
**This looks good on paper — but what's the reality?**
]

---

# Reality: Massive absenteeism

&lt;div style="text-align: center;"&gt;
  &lt;img src="figures/health5.png" style="width: 100%; max-width: 520px;" /&gt;
&lt;/div&gt;

--

Local workers made **unannounced weekly visits** to every public facility for a year.

--

**Shocking findings:**
- Sub-centers were **closed 56% of the time** during official opening hours
- On average, **45%** of staff were absent at sub-centers and **36%** at larger centers
- At larger centers, **78% of visits** found at least one medical staff member missing

---

# Reality: Private sector is unregulated

&lt;div style="text-align: center;"&gt;
  &lt;img src="figures/health4.png" style="width: 100%; max-width: 650px;" /&gt;
&lt;/div&gt;

--

**Among private "doctors" surveyed (72):**
- **41%** had no medical college degree; **17%** had not finished high school (class 12)
- **18%** had no medical training at all (not even a one-week course)
- Patients got an injection in **68%** of visits, a drip in 12% — but a test in only 3%

.small[The table's last row (0.82) contradicts the paper's text, which says 18% have no training at all.]

---

class: tight

# The vicious cycle

**Why are public facilities empty and staff absent?** Two reinforcing explanations:

--

**1. Patients are discouraged by absenteeism**
- If nurses are often absent, why bother going?
- Patients switch to private providers (even if unqualified)

--

**2. Staff are discouraged by low patient numbers**
- If few patients come, why show up?
- No accountability, no consequences for absence

--

.content-box-green[
**These two problems reinforce each other** — creating a downward spiral in public health care quality.
]

.small[The data show staff presence and patient numbers move together; they can't tell which comes first (recall Week 4).]

--

**Two ways out (Week 7's logic):** fix **supply** (make staff show up) or fix **demand** (change the family's calculation). Session 2.

---

# Session 1 summary

--

**Health is multidimensional** — we need multiple indicators (life expectancy, infant mortality, DALYs, nutrition measures).

--

**The Udaipur case study** reveals:
- Poor health status despite available public facilities
- Massive absenteeism in public clinics; "free" care that is not really free
- People pay for unqualified private care instead
- A vicious cycle of low demand and low supply quality

--

**The opening puzzle, answered:** public care is not free, staff are often absent, and private providers at least show up.

--

**Next:** What can be done to fix these problems?

# Solution: Community monitoring in Uganda

**The problem:** in the study's control clinics, 47% of staff were absent when surveyors visited.

--

**The intervention:** Björkman and Svensson (2009) tested a grassroots approach

- **Design:** an RCT (Week 5) — 50 rural clinics; 25 randomly chosen communities got the program.

--

**How it worked:**

1. **Household survey** — collected data on experiences with public health facilities
2. **Community meeting** — shared survey results ("report cards") with villagers
3. **Health center meeting** — shared results with health workers
4. **Interface meeting** — community and health workers agree on a joint action plan
5. **Ongoing monitoring** — community members monitor the clinic (follow-up meetings after 6 months)

--

.content-box-yellow[
**Predict:** will report cards and meetings change staff absence? Clinic use? Child deaths?
]

---

# Uganda: Results on process

&lt;div style="text-align: center;"&gt;
  &lt;img src="figures/monitoring.png" style="width: 100%; max-width: 550px;" /&gt;
&lt;/div&gt;

**In this figure:** staff absence was 47% in control clinics and 13 points lower in treatment clinics (row 5).

---

# Uganda: Results on utilization

&lt;div style="text-align: center;"&gt;
  &lt;img src="figures/monitoring3.png" style="width: 100%; max-width: 700px;" /&gt;
&lt;/div&gt;

**In this figure:** control clinics saw 661 outpatients a month; treatment clinics about 130 more (+20%).

---

# Uganda: Results on immunization and health

&lt;div style="text-align: center;"&gt;
  &lt;img src="figures/monitoring2.png" style="width: 100%; max-width: 700px;" /&gt;
&lt;/div&gt;

**In this figure:** positive numbers = more children immunized in treatment communities; stars = significant.

--

**Findings:** In treatment communities, one year later:
- Health workers were more present, and more people used the clinic
- Babies weighed more, and **under-5 mortality fell by 33%** (144 → 97 deaths per 1,000 births)
- Because communities were randomly chosen, we can read these as **causal effects**

---

# Pay-for-performance incentives

**The idea:** Reward health workers based on outcomes, not just showing up.

--

**Example: Rwanda** (national scale-up from 2005): clinics got a bonus for each service delivered, e.g.:
- Each child fully vaccinated on time
- Each birth delivered at the clinic
- Each emergency correctly referred to a hospital

--

**Results:** (Gertler and Vermeersch, 2012, World Bank working paper)
- Bonuses raised staff pay by 38% on average
- The **know–do gap** — between what staff know and what they do — shrank by about **20%**
- **Child health improved:** babies weighed more; children aged 2–4 were taller
- Comparison clinics got the same extra money, without bonuses — so the gain comes from incentives

--

.content-box-green[
**Incentives can work** — but they need to be well-designed and monitored.
]

# Case study: Deworming in Kenya

**The problem:** helminth infections (intestinal worms) are widespread in developing countries.

**Recall Week 4:** deworming had among the largest schooling gains per dollar in Duflo's TED chart.

--

&lt;div style="text-align: center;"&gt;
  &lt;img src="figures/children.png" style="width: 100%; max-width: 560px;" /&gt;&lt;br&gt;
  &lt;small&gt;Children requiring preventive treatment for soil-transmitted helminths (2022)&lt;/small&gt;
&lt;/div&gt;

**In this figure:** darker = more children needing treatment; India alone has over 100 million.

---

# Why deworming matters

**Private benefits:**
- Chronic infection causes anemia and lethargy
- Lower productivity and poor school attendance

--

**Social benefits (externalities):**
- Worms spread through feces and contaminated soil and water
- When many people are dewormed, overall infection rates fall
- Benefits even those who weren't treated

--

&lt;br&gt;

.content-box-green[
**Deworming has large positive externalities** — treating one child helps protect others: the gap between the two benefit lines.
]

---

# Kenya deworming study

**Study:** Miguel and Kremer (2004)

**Design:** 75 schools in Busia, Kenya, randomly phased in — whole schools, not individual pupils

&lt;div style="text-align: center;"&gt;
  &lt;img src="figures/worm1.png" style="width: 100%; max-width: 550px;" /&gt;
&lt;/div&gt;

--

- **1998:** Group 1 receives free deworming; Groups 2 &amp; 3 are controls
- **1999:** Groups 1 &amp; 2 receive deworming; Group 3 is control (a phased rollout, Week 5)
- **Why whole schools?** Worms spread, so treated pupils protect untreated classmates (spillovers)

---

# Kenya: Results

**Direct effects in treatment schools:**
- Far fewer moderate-to-heavy worm infections (including schistosomiasis)
- School absenteeism fell by **one quarter** — at a very low cost per pupil
- No clear improvement in test scores

--

**Spillover effects (externalities):**

| Group | Effect |
|-------|--------|
| Untreated children in **treatment schools** | Also healthier, and attended school more |
| Children in **nearby schools** | Also healthier, and attended school more |

--

.content-box-green[
**The externalities are substantial** — large enough, the authors argue, to justify **free** treatment.
]

.small[Recall Week 4: these results come from an area where worm infections were very common.]

---

# Demand-side barriers to health

Even when services exist, families may not use them. Each barrier is a line in the graph:

--

| Barrier | Example | In the graph |
|---------|---------|--------------|
| **Externalities** | Don't count benefits to others (deworming) | Family's line below everyone's |
| **Price sensitivity** | Small fees deter use | A small fee moves cost above benefit |
| **Information gaps** | Don't know the benefits of prevention | Family's benefit line *as they see it* is too low |
| **Poverty, credit constraints** | Can't pay now, even if it saves money later | Family discounts the future more |

---

# Demand is very sensitive to price

**Your prediction:** in Kenya, pregnant women were offered a bed net — free at some clinics, $0.60 at others (Cohen &amp; Dupas, 2010). How much lower was take-up at $0.60?

--

.pull-left[
&lt;img src="figures/demand.png" style="width: 100%; max-width: 410px;" /&gt;&lt;br&gt;
&lt;small&gt;Source: &lt;a href="https://www.povertyactionlab.org/policy-insight/impact-price-take-and-use-preventive-health-products"&gt;J-PAL Policy Insight&lt;/a&gt;&lt;/small&gt;
]

.pull-right[
**60 percentage points lower** — and the women who got free nets used them just as much.

**In this figure:** the same pattern for many products; the Kenya deworming program (yellow) fell from 75% when free to 18% at about 30 cents.

**Key finding:** take-up of preventive health products **drops quickly** as prices rise — even small prices matter.
]

&lt;div style="clear: both;"&gt;&lt;/div&gt;

---

# Information campaigns alone aren't enough

**Common assumption:** If people knew the benefits of health products, they would buy them.

--

**Evidence:**
- Kenya: teaching children about worm prevention (same program) did not change their behavior
- Four countries: information alone did not raise willingness to pay for soap, slippers, or vitamins

.small[Sources: Kremer &amp; Miguel (2007); Meredith et al. (2013); both summarized in the J-PAL Policy Insight on prices.]

--

&lt;br&gt;

.content-box-yellow[
**Knowing something is good for you isn't enough** if you can't afford it or face other barriers.
]

--

.small[Information is not always weak: in Week 4, telling families about the returns to schooling was very cost-effective. Context matters.]

---

# Should health products be free?

**Concerns about subsidies/free provision:**

--

| Concern | Evidence |
|---------|----------|
| "People won't value free things" | Cohen &amp; Dupas (2010): free bed nets were used as much as paid ones |
| "Price anchoring": people won't pay later | Dupas (2014): short-term subsidies don't reduce later demand |
| "Overuse leads to drug resistance" | Partly true for **drugs**: Cohen, Dupas &amp; Schaner (2015): nearly half of subsidized malaria pills went to people without malaria; rapid tests help |

--

.content-box-green[
**For preventive products, evidence supports subsidies and free provision.** For drugs, targeting matters.
]

.small[Recall Kenya: free deworming was justified by its large spillovers to other children.]

---

# Beyond this week's cases

Rigorous studies (mostly RCTs) support these interventions too:

--

| Intervention | Evidence | Side (Week 7) |
|--------------|--------------|------|
| **Community health workers** | Uganda: under-5 deaths fell 27% | Supply |
| **Small incentives for vaccination** | Udaipur: full immunization 18% → 39% | Demand |
| **Chlorine dispensers at water sources** | Kenya: water treatment up 53 percentage points | Supply |
| **Vitamin A supplements** | Child deaths about 12% lower | Supply |
| **School-based deworming** | Kenya: school absenteeism down by a quarter | Supply |

.small[Sources, by row: Björkman Nyqvist et al. (2019); Banerjee et al. (2010, *BMJ*); J-PAL summary of Kremer et al. (Kenya); Imdad et al. (2022, Cochrane review of trials); Miguel &amp; Kremer (2004).]


---

# Main takeaways

**Health is complex** — it encompasses physical, mental, and social wellbeing, requiring multiple indicators to measure.

--

**Public systems fail on the supply side** — absenteeism and no accountability (Udaipur); "free" care is not really free.

--

**Supply-side solutions** with RCT evidence: community monitoring (Uganda) and pay-for-performance (Rwanda).

--

**Families under-invest in health** — part of the benefit goes to others (contagion), and the costs come before the benefits.

--

**Demand-side barriers** include poverty, price sensitivity, credit constraints, and information gaps.

--

**Demand for preventive health is very price-sensitive** — small fees sharply reduce take-up, and free products are used just as much; for drugs, targeting matters.

--

**Externalities matter** — deworming helps untreated children too (where worm infections are common).

---

# This week's vocabulary (1/3)

**Measuring health**

- **Life expectancy at birth** — years a newborn would live on average if today's death rates continued
- **Infant mortality rate (IMR)** — deaths before age 1 per 1,000 live births
- **DALY** — one year of healthy life lost, to early death or to illness and disability
- **Stunting** — low height for age: a sign of long-term or early malnutrition
- **Wasting** — low weight for height: a sign of current malnutrition
- **Hidden hunger** — lack of vitamins and minerals (iron, zinc, vitamin A) despite enough calories

---
class: vocab

# This week's vocabulary (2/3)

**Why families under-invest in health**

- **Contagion externality** — preventing one person's infection also protects others
- **Herd immunity** — when enough people are vaccinated, the disease cannot spread, protecting others too

**Demand side: prices and products**

- **Preventive health product** — something that prevents illness (bed net, water chlorine, deworming pill)
- **Take-up** — the share of people who accept or buy a product or program
- **Free provision vs. cost-sharing** — giving a product away vs. charging users part of the cost
- **Helminths** — intestinal worms, spread through contaminated soil and water

---
class: vocab

# This week's vocabulary (3/3)

**Supply side: health workers and clinics**

- **Absenteeism** — staff not at work during official hours
- **Out-of-pocket spending** — what patients pay themselves for care and medicines
- **Community monitoring** — citizens use shared information to hold clinic staff accountable
- **Report card** — survey results on service quality, shared with the community and providers
- **Pay-for-performance (P4P)** — bonuses paid for each service delivered or target met
- **Know–do gap** — the gap between what health workers know and what they do (Rwanda)
