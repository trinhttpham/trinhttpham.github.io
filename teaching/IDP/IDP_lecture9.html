# Session 1

&lt;div style="font-size: 22px; margin-top: 10px;"&gt;
Labor Markets in Developing Countries
&lt;/div&gt;

---

# Why labor markets matter for development

--

For most of the world's population — especially the poor — **labor is their principal asset**.

--

In developing countries, people earn their living from:
- Wage employment — formal or informal
- Self-employment — a family farm, a small shop, street vending

--

&lt;br&gt;

To understand poverty and development, we must understand:
- Who gets work?
- At what wages?
- Under what conditions?

---

class: inverse, middle, center

# Employment Indicators

---

# Key employment concepts

| Term | Definition |
|------|------------|
| **Employed** | Worked at least one hour for pay or profit last week — formal or informal |
| **Unemployed** | No job, available to work, and actively looking |
| **Hidden unemployment** | Want to work but gave up looking — *not* counted as unemployed |
| **Underemployment** | Working fewer hours than wanted, or in a job below one's skills |

**Labor force** = employed + unemployed. **Unemployment rate** = unemployed ÷ labor force.

**Labor force participation rate** = labor force ÷ population aged 15 and over.

--

**Example:** A young person who lost their job last month and is actively looking for work → **unemployed**

**Example:** A trained accountant working part-time as a street vendor → **underemployed**

---

# Predict: where is unemployment highest?

Recall the definition: **unemployed** = no job, available to work, and actively looking.

&lt;br&gt;

.content-box-yellow[
**Predict:** Which countries have higher unemployment rates — the poorest countries, or middle-income countries?
]

&lt;br&gt;

Write down your guess and one reason. Then we look at the map.

---

# Do poorer countries have higher unemployment?

&lt;iframe src="https://ourworldindata.org/grapher/unemployment-rate?tab=map" loading="lazy" style="width: 100%; height: 500px; border: 0px none;" allow="web-share; clipboard-write"&gt;&lt;/iframe&gt;

---

# Low unemployment is not always good news

**In the map:** many of the poorest countries report very low unemployment rates.

The highest rates are in southern Africa — not in the poorest countries.

--

**Why?**

- Many people **cannot afford to be unemployed** — no safety nets
- They take any work available, even low-paying informal jobs
- **Underemployment** is more common than unemployment in poorer countries
- Discouraged workers who stopped looking are not counted as unemployed

--

.content-box-green[
**So:** the unemployment rate says little about poorer countries — look at the *kind* of work people do.
]

---

# Gender: who is in the labor force?

&lt;iframe src="https://ourworldindata.org/grapher/ratio-of-female-to-male-labor-force-participation-rates-ilo-wdi?tab=map" loading="lazy" style="width: 100%; height: 500px; border: 0px none;" allow="web-share; clipboard-write"&gt;&lt;/iframe&gt;

---

# Gender gaps vary widely across countries

**In the map:** women's labor force participation rate ÷ men's — 100% means equal.

- Far below men's in much of the Middle East, North Africa, and South Asia
- Close to men's in many Sub-Saharan African countries (Benin, Mozambique, Nigeria: about 96%)
- The gap does not simply follow income

--

**Possible reasons:**

- Labor market discrimination
- Traditional gender roles and family responsibilities
- Educational and occupational segregation

--

.small[*Why not compare unemployment rates? They count only people who work or look for work — women outside the labor force are missing.*]

# Labor Markets in Developing Countries

&lt;div style="font-size: 20px; margin-top: 10px;"&gt;
What makes them different?
&lt;/div&gt;

---

# Feature 1: Low share of wage employment

Most work in developing countries is **self-employment**, not wage work.

&lt;div style="text-align: center;"&gt;
  &lt;img src="figures/labor1.png" style="width: 100%; max-width: 450px;" /&gt;
&lt;/div&gt;

--

**In this figure:** share of days in a month that people work — blue = for a wage; white bar = all work.

- Days in wage work: typically 10–15% in rural areas, and 25–50% in most urban areas (Breza &amp; Kaur 2025)
- Most other work days are self-employment: family farms, small shops, street vending

---

# Feature 2: Higher labor market flows

Donovan et al. (2023): **workers in poorer countries move in and out of jobs much more often**.

--

&lt;div style="text-align: center;"&gt;
  &lt;img src="figures/donovan1.png" style="width: 100%; max-width: 800px;" /&gt;
&lt;/div&gt;

**In this figure:** y = share of workers who leave work within one quarter; labeled dot = one country's average.

The x-axis doubles at each step; the line is a regression fit (Week 4). Exit rates are about **2×** as high in poorer countries.

---

# Feature 2: Higher labor market flows

**Job-finding rates** are only slightly higher in poorer countries.

&lt;div style="text-align: center;"&gt;
  &lt;img src="figures/donovan2.png" style="width: 100%; max-width: 800px;" /&gt;
&lt;/div&gt;

**In this figure:** the lines slope down gently and the dots are widely scattered — *not* statistically significant.

The small extra job-finding in poorer countries is all into **self-employment**, not wage jobs.


---

# Feature 2: Higher labor market flows

**Job-to-job moves** are about **2×** and **occupation switching** about **4×** as high in poorer countries.

&lt;div style="text-align: center;"&gt;
  &lt;img src="figures/donovan3.png" style="width: 100%; max-width: 800px;" /&gt;
&lt;/div&gt;

**In this figure:** occupation switching = changing the *type* of work (e.g., farm worker → driver).


---

# Why are flows higher? It's about job quality

Donovan et al. (2023): the extra flows in poorer countries are mostly moves **into and out of marginal jobs**.

--

Marginal jobs = low-paid, unstable work:
- Self-employment
- Informal wage jobs (the employer pays no pension or social insurance)
- Low-earnings wage jobs

--

&lt;br&gt;

.content-box-yellow[
**Key finding:** Flows for workers in **formal wage jobs with above-median pay** are similar around the world.
]

--

&lt;br&gt;

The difference is that **bad jobs are more common** — not that labor markets are more dynamic.

---

# Feature 3: A slippery job ladder

In rich countries, workers often climb: unemployment → entry-level job → better job → even better job.

--

Do workers in poorer countries climb too? Or do they **slip back down or off** the ladder?

--

**The data:** labor force surveys that re-interview the same people for 3 quarters in a row (28 countries).

- Recall Week 3: following the same people over time = **panel data**
- Only panel data can show *moves*: where a person was last quarter and where they are now

--

**The answer:** in poorer countries, people who find work or move up often **fall back within one quarter**.

---

# How to read the job-ladder figures

**Rows** = a person's moves in quarters 1 → 2 (e.g., **U,S** = unemployed, then self-employed)

**Columns** = where that person is in quarter 3

**Outcome:** did the person make this move? (a 0/1 dummy, Week 3) → a share for each country and year

**Each cell** = the slope from regressing that share on log GDP per capita (Week 4)

--

- **Blue / negative:** this move is more common in **poorer** countries
- **Red / positive:** this move is more common in **richer** countries
- Stars = statistically significant; numbers in parentheses = standard errors
- "Associated with" income level — not caused by it

--

**Rule of thumb:** slope × 1.9 ≈ gap between the poorest and richest countries in the sample.

.small[*Log GDP per capita is 1.9 higher in the richest countries than in the poorest (about 6–7 times the income).*]

---

# Slippery ladder (1): self-employment

&lt;div style="text-align: center;"&gt;
  &lt;img src="figures/donovan7.png" style="width: 100%; max-width: 420px;" /&gt;
&lt;/div&gt;

.small[U = unemployed, N = inactive (not looking for work), S = self-employed, W = wage worker]

--

**In this figure** (poorest vs. richest countries):
- **S,W** (self-employed → wage job): **28 percentage points** more likely to be back in S (−0.146 × 1.9)
- **U,S** (unemployed → self-employed): **10 percentage points** more likely to be unemployed again (−0.051 × 1.9)

---

# Slippery ladder (2): wage jobs and pay

&lt;div style="text-align: center;"&gt;
  &lt;img src="figures/donovan8.png" style="width: 100%; max-width: 480px;" /&gt;
&lt;/div&gt;

.small[Pay decile = workers ranked by earnings into 10 equal groups, within each country.]

.small[Wd / Ws / Wu = a wage job in a lower / the same / a higher pay decile than last quarter.]

--

**In this figure:**
- Left, **W,Wu row:** workers who just moved up a decile are less likely to stay there (Ws) in poorer countries
- Falling down or off (to U, N, S, or Wd): **40–46 percentage points** more likely in the poorest countries
- Right: the red diagonal = people who find any job **keep it** more often in richer countries



---

# Feature 4: Self-employment ≈ Unemployment

In developing countries, **self-employed and unemployed workers look very similar**:

&lt;div style="text-align: center;"&gt;
  &lt;img src="figures/donovan9.png" style="width: 100%; max-width: 800px;" /&gt;
&lt;/div&gt;

--

- They switch to wage work at similar rates (left: ratio near 1 in poorer countries; about 5 in the US)
- They earn similar wages after switching (right: the two lines are close in poorer countries)

---

# Summary: Labor markets in developing countries

| Feature | Implication |
|---------|-------------|
| **Low wage employment** | Most people are self-employed or informal |
| **Higher labor flows** | But driven by marginal jobs, not good jobs |
| **Slippery job ladder** | Workers who move up often fall back |
| **Self-employment ≈ Unemployment** | Self-employment is often a fallback when wage jobs are scarce |

--

&lt;br&gt;

.content-box-green[
**Bottom line:** The challenge is not just "more jobs" — it is **good jobs** with stable wages and benefits.
]

---

# Formal vs. Informal Employment

---

# What is informal employment?

&lt;div style="font-size: 22px; text-align: center;"&gt;
&lt;iframe width="700" height="380" src="https://www.youtube.com/embed/1pHot7na1n8?si=8oopKJiB_GWo0ePS&amp;amp;controls=1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen&gt;&lt;/iframe&gt;
&lt;/div&gt;

---

# Informality: Two perspectives

.pull-left[
**From the employee perspective:**

- Jobs without formal contracts
- No legal protections
- No benefits (health insurance, paid leave, pension)
- Includes: casual work, street vending, domestic work
- Often: job insecurity, low/irregular income
]

.pull-right[
**From the employer perspective:**

- Small businesses not officially registered
- May avoid taxes and labor laws
- For some: survival strategy
- For others: flexibility and independence
]

&lt;div style="clear: both;"&gt;&lt;/div&gt;

---

# Informal employment around the world

&lt;iframe src="https://ourworldindata.org/grapher/informal-employment-of-total-non-agricultural-employment?time=2017&amp;tab=map" loading="lazy" style="width: 100%; height: 500px; border: 0px none;" allow="web-share; clipboard-write"&gt;&lt;/iframe&gt;

---

# Informality remains a major challenge

- In 2023: **over 2 billion workers** worldwide were informally employed (58% of all workers)
- Progress has been slow: 58.4% in 2015 → 58.0% in 2023 (UN *SDG Report 2024*)

&lt;div style="text-align: center;"&gt;
  &lt;img src="figures/informality.png" style="width: 100%; max-width: 500px;" /&gt;&lt;br&gt;
  &lt;small&gt;Source: &lt;a href="https://ilostat.ilo.org/topics/informality/"&gt;ILO Statistics&lt;/a&gt;&lt;/small&gt;
&lt;/div&gt;

**In this figure:** darker = a higher share of jobs is informal; highest in Sub-Saharan Africa and South Asia.

---

# Why are formal wages higher?

Wages in the formal sector are generally higher than in the informal sector. Why?

--

**High unionization:**
- Collective bargaining pushes wages up
- Unions negotiate for benefits and job security

--

**Government regulation:**
- Minimum wage laws
- Mandated benefits (health insurance, pension, paid leave)
- These rules are enforced in formal firms, not informal ones

--

**Efficiency wages:**
- Employers pay above the market wage on purpose
- Goal: attract better workers, keep them longer, and motivate them to work hard

---

# The formal-informal relationship

&lt;div style="text-align: center;"&gt;
  &lt;img src="figures/formal_informal.png" style="width: 100%; max-width: 700px;" /&gt;
&lt;/div&gt;

--

**In this figure:**
- Left: the formal wage is set above the market level (W̄&lt;sub&gt;M&lt;/sub&gt;) → more job seekers than formal jobs
- Right: those left out move to the informal sector (S → S′) → the informal wage falls to W&lt;sub&gt;I&lt;/sub&gt;
- Heavy regulation of formal firms also pushes some work into the informal sector

---

# Does informality grow in good times or bad times?

The economy moves in cycles: **booms** (fast growth) and **recessions** (downturns).

--

**Pro-cyclical** = grows during booms:
- Economic growth increases demand for goods and services
- Growing formal firms buy from informal suppliers

--

**Counter-cyclical** = grows during recessions:
- Workers laid off from formal jobs look for informal work
- The informal sector absorbs workers who have nowhere else to go

--

&lt;br&gt;

.content-box-yellow[
The relationship depends on economic conditions and the structure of the labor market.
]

---

# Session 1 summary

--

**Labor is the main asset of the poor** — understanding labor markets is essential for development.

--

**Developing-country labor markets:** few wage jobs, frequent moves in and out of bad jobs, a slippery job ladder.

--

**Informal employment** is the norm — about 58% of the world's workers, highest in the poorest regions.

--

**Formal wages are higher** due to unions, regulations, and efficiency wage considerations.

--

**The challenge:** Creating good jobs, not just any jobs.

---

# Session 2

&lt;div style="font-size: 22px; margin-top: 10px;"&gt;
Migration
&lt;/div&gt;

---

# Why study migration?

In many developing countries:
- Stable, formal wage jobs are scarce
- Many workers are in informal, unstable employment

--

To improve livelihoods, households often rely on **labor mobility**:
- Moving within the country (rural-urban)
- Moving internationally

--

Migration is:
- A response to economic necessity
- Shaped by social networks and policies
- Both a challenge and an opportunity for development

---

class: inverse, middle, center

# Internal Migration

&lt;div style="font-size: 20px; margin-top: 10px;"&gt;
Rural-Urban Migration
&lt;/div&gt;

---

# Why do people migrate to cities?

The classic economic answer: **wage gaps**

--

- Urban wages are typically higher than rural wages
- Migration shifts workers toward higher-productivity jobs
- This can reduce poverty and increase efficiency

--

&lt;br&gt;

But if urban wages are higher, **why doesn't everyone migrate?**

---

# The Harris-Todaro Model: A simple example

Consider Maria, a rural worker in Mexico deciding whether to migrate to the city.

--

**If she stays in the village:**
- She earns **$5/day** working on a farm (guaranteed)

--

**If she migrates to the city:**
- She *might* get a factory job paying **$15/day**
- But there's only a **50% chance** of finding that job
- If she doesn't find work, she earns **$0**

--

&lt;br&gt;

**Should Maria migrate?**

---

# The Harris-Todaro Model: The calculation

**Expected urban earnings:**

`$$\text{Expected wage} = (\text{Probability of job}) \times (\text{Urban wage})$$`

$$= 0.50 \times \$15 = \$7.50 \text{ per day}$$

--

**Compare to rural wage:** $5/day

--

**Decision:** $7.50 &gt; $5, so Maria should migrate!

.small[*This assumes Maria cares only about average earnings. If earning $0 means her family goes hungry, she may stay — more on risk soon.*]

--

.content-box-green[
**The Harris-Todaro insight:** People compare the rural wage with the *expected* urban wage, not the urban wage itself.

This explains why migration continues even when there is urban unemployment.
]

---

# Policy implications of Harris-Todaro

**Should governments create more urban jobs to reduce urban unemployment?**

--

Surprisingly, **not necessarily!**

--

- Creating more urban jobs raises the probability of finding work
- This attracts MORE migrants
- Urban employment AND urban unemployment could both rise

--

&lt;br&gt;

**Better approaches:**

- Raise rural wages (rural development, agricultural technology)
- Reduce the urban-rural wage gap
- Decentralize employment toward rural areas

---

# The new economics of migration

The Harris-Todaro model focuses on **individual** decisions.

--

But migration decisions are often made at the **household** level:

--

- Family invests in sending one member to migrate
- Expects **remittances** in return
- Spreads risk across locations: a drought at home does not hit the migrant's city job

.small[*Recall Week 2: a drought is a covariate shock — neighbors cannot help each other, but a migrant far away can.*]

--

.content-box-yellow[
**Migration as household strategy:** Sending a migrant is like an investment.

Pay the costs now, receive remittance income later.
]

---

# Migration barriers

If migration is beneficial, why don't more poor people migrate?

--

**Migration is costly:**
- Travel expenses
- Fees to intermediaries (visas, work permits)
- Risk of failure (no job, deportation)

--

**The poorest face the biggest barriers:**
- Cannot borrow against future earnings
- Cannot afford upfront costs
- Cannot absorb the risk of failure

--

&lt;br&gt;

.content-box-yellow[
**Paradox:** Those with the most to gain from migration often migrate the least.
]

---

# Case study: Seasonal hunger in Bangladesh

**The problem:** seasonal hunger affects about **300 million** of the world's rural poor — the **lean season**.

--

- Between planting and harvest, there is little farm work
- Food prices rise
- Families go hungry for 2–3 months (in northern Bangladesh: September–November, called *monga*)

.small[*Recall Week 2 (transitory poverty) and Week 6 (public works jobs offered in this same lean season).*]

--

**Serious long-term consequences, especially for:**
- Pregnant women
- Young children (cognitive and physical development)

.small[*Source: Levy, Verclas, Mobarak &amp; Reimão, Policy Options (IRPP), December 2016.*]

--

&lt;br&gt;

Could migration help? Many rural areas have seasonal hunger while nearby cities have jobs.

---

# The Bangladesh migration experiment

**Study:** [Bryan, Chowdhury, and Mobarak (2014)](https://onlinelibrary.wiley.com/doi/abs/10.3982/ECTA10489?msockid=279c202ed2da6a530ea936ded3cd6ba4)

--

**Design:** RCT in 100 villages (about 1,900 households) in northern Bangladesh, 2008 lean season

| Group | What households received |
|-------|--------------|
| **Control** | Nothing |
| **Information** | Information about jobs and wages in the city |
| **Cash or credit** | $8.50 (600 taka) — a round-trip bus fare — *only if* a member migrates |

--

&lt;br&gt;

**The idea:** Remove the financial barrier to seasonal migration.

---

# Results: Migration incentives work

**Key findings:**

--

- Seasonal migration rose from **36%** (control) to **57–59%** of households (+22 percentage points)

- Information alone did not change migration

--

- Families who sent a migrant because of the incentive ate **550–700 more calories** per person per day

--

- **A year later**, with no new incentive, treated households still migrated **9 percentage points** more (7 after 3 years)

--

.content-box-green[
**A small one-time subsidy can have lasting effects** — consistent with families learning that migration works for them.
]

.small[*But scaling up was harder: a 2017 large-scale RCT of the program did not raise migration (recall Week 5: results may not hold at scale).*]

---

# The brain drain debate

**Traditional concern:** When skilled workers emigrate, origin countries lose human capital.

--

**"Brain drain":**
- Doctors, engineers, scientists leave
- Countries that invested in their education lose the returns
- Public services suffer (fewer doctors, teachers)

--

&lt;br&gt;

**But is this the whole story?**

---

# Brain drain vs. brain gain

**New evidence suggests migration can also cause "brain gain":**

--

**Incentive effects:**
- The chance to emigrate raises the payoff to education (recall Week 4: returns to education)
- More people invest in skills (even if not all leave)

--

**Remittances:**
- Migrants send money home
- Families invest in education, health, businesses

--

**Knowledge transfer:**
- Diaspora networks share knowledge
- Return migrants bring back skills and ideas

---

# Predict: nurses in the Philippines

Between 2000 and 2006, the United States opened more visas for foreign nurses.

About **27,000** Filipino nurses left for the US.

--

.content-box-yellow[
**Predict:** After these years, did the Philippines have *fewer* or *more* nurses at home? Why?
]

--

**What happened:** about **114,000** new nurses were licensed in the Philippines in the same years.

- A net gain of about **87,000** nurses ([Batista et al. 2025](https://www.science.org/doi/10.1126/science.adr8861))
- The chance to emigrate led far more people to train than the number who left

--

**When would this *not* happen?**

---

# Group activity: Advise the minister

A health minister is worried about brain drain and proposes a new rule:

.content-box-yellow[
**Nurses must work 5 years at home before they may emigrate.**
]

--

**In your groups (10 minutes):**

- Decide: do you advise **for** or **against** the rule?
- Find **two pieces of evidence** in Batista et al. (2025) to support your advice
- Name one thing that would change your mind

--

**Then:** a class vote, and two groups from each side explain their evidence.

---

# Batista et al. (2025): Key findings

**Question:** Does high-skilled emigration cause "brain drain" or "brain gain"?

--

**Main findings:**

- Migration chances often **lead more people to get skills at home** — even if not all of them leave
  - Example: the Filipino nurses — about 27,000 left, about 114,000 were newly licensed

--

- Other channels: remittances pay for schooling; the diaspora shares knowledge; return migrants bring skills

--

- **Net effects depend on:** how fast schools can train more people, jobs at home, and policy

--

**Policy implication:** Don't restrict emigration — expand training, engage the diaspora, and ease return.


---

# Main takeaways

**Labor markets in developing countries:** few wage jobs, frequent moves through marginal jobs, a slippery job ladder.

--

**Informal employment** dominates — over half the global workforce lacks formal protections.

--

**Migration decisions** weigh expected wages (Harris-Todaro) against costs and risks.

--

**Migration barriers** prevent the poorest from moving — small subsidies can help (Bangladesh study).

--

**Brain drain concerns** are real, but migration can also generate "brain gain" through incentives, remittances, and knowledge transfer.

--

**Policy implications:** 
- Create good jobs, not just any jobs
- Reduce migration barriers for the poor
- Engage diaspora networks rather than restricting emigration

# This week's vocabulary (1/2)

**Employment indicators**

- **Labor force** — everyone who is working or actively looking for work
- **Labor force participation rate** — share of people aged 15+ who are in the labor force
- **Unemployed** — no job, available to work, and actively looking
- **Hidden unemployment** — wants work but has stopped looking; not counted as unemployed
- **Underemployment** — working fewer hours than wanted, or in a job below one's skills

**Labor markets in developing countries**

- **Wage employment** — working for an employer in return for a wage
- **Self-employment** — working for yourself (a family farm, a shop, street vending)
- **Labor market flows** — moves into and out of jobs, unemployment, and inactivity
- **Marginal jobs** — low-paid, unstable work (much self-employment, low-earnings wage jobs)
- **Job ladder** — moving step by step into better-paid jobs

---
class: vocab

# This week's vocabulary (2/2)

**Formal vs. informal employment**

- **Informal employment** — work without a formal contract, legal protection, or benefits
- **Efficiency wage** — paying above the market wage to attract, keep, and motivate good workers
- **Pro-cyclical / counter-cyclical** — grows during booms / grows during recessions

**Migration**

- **Harris–Todaro model** — people migrate if the *expected* urban wage (job chance × wage) beats the rural wage
- **Remittances** — money that migrants send home
- **Lean (hungry) season** — the months between planting and harvest, when work is scarce and food is costly
- **Brain drain / brain gain** — skilled emigration lowers / raises the stock of skills at home
- **Diaspora** — people from a country who live abroad

  function buildMenu() {
    var containers = document.querySelectorAll('.remark-slide-container');
    var seen = {};
    var count = 0;
    for (var i = 0; i < containers.length; i++) {
      var content = containers[i].querySelector('.remark-slide-content');
      if (!content) continue;
      var cls = content.className || '';
      if (cls.indexOf('inverse') === -1 || cls.indexOf('title-slide') !== -1) continue;
      if (!(cls.indexOf('middle') !== -1 && cls.indexOf('center') !== -1)) continue;
      var h = content.querySelector('h1, h2');

      label = label.replace(/\d+\s*\/\s*\d+\s*$/, '').trim();  /* strip slide number */
      if (!label) continue;
      if (label.length > 70) label = label.substring(0, 67) + '...';
      if (/^(questions|thank|do you have any)/i.test(label)) continue;
      if (seen[label]) continue;   /* incremental builds repeat the same slide */
      seen[label] = true;
      var a = document.createElement('a');
      a.href = '#' + (i + 1);
      a.textContent = label;
      list.appendChild(a);
      count++;
    }
    if (count === 0) { menu.style.display = 'none'; }
