---

# Doing research

- Research is about making discoveries: generating new knowledge

--

- How big do the discoveries need to be for a successful PhD?

--

  - Not a **top-5** publication

--

  - A dissertation or thesis that contributes to the literature, even a little

--

  - and the job you want

---

# Writing a dissertation (or a paper)

- There is no single right way, but you have to do it

--

- There is no "right topic", but work on something **important** that **genuinely interests you**

--

  - You will live with it for months or years; an unimportant topic takes as long to write as an important one

--

- What makes a topic important? Ask: **why should people care?**

--

  - **Real-world impact + new knowledge (even a bit) = important topic**

---

---

# Where to look for ideas: journals

- **Top 5**: *AER*, *QJE*, *JPE*, *Review of Economic Studies*, *Econometrica*

--

- **Top general interest**: *AEJ: Applied*, *AEJ: Economic Policy*, *REStat*, *Economic Journal*, *JEEA*

--

- **Top field journals**: *Journal of Public Economics*, *Journal of Development Economics*, *Journal of Labor Economics*, *Journal of Health Economics*, *Journal of Environmental Economics and Management*, *Journal of Monetary Economics*, *Journal of International Economics*, and their counterparts in your field

--

- **Reviews**: *Journal of Economic Literature*, *Journal of Economic Perspectives*, *Annual Review of Economics*

---

# Where to look for ideas: before the journals

- **Working papers**: &lt;a href="https://www.nber.org/papers"&gt;NBER&lt;/a&gt;, &lt;a href="https://cepr.org/publications/discussion-papers"&gt;CEPR&lt;/a&gt;, &lt;a href="https://www.iza.org/publications/dp"&gt;IZA&lt;/a&gt;, &lt;a href="https://www.worldbank.org/en/research"&gt;World Bank Policy Research&lt;/a&gt;

--

- **Seminars**: on campus and online -- go, and watch how people ask questions

--

- **Blogs and digests**: &lt;a href="https://voxdev.org/"&gt;VoxDev&lt;/a&gt;, the World Bank &lt;a href="https://blogs.worldbank.org/en/impactevaluations"&gt;Development Impact&lt;/a&gt; blog, the NBER program reports in your field

--

- **People**: the leading researchers in your field, and what they are presenting now

--

- **Elsewhere**: newspapers and books, even in other fields

---

# Research moves: development economics, 2018-2025

.pull-left[
**The questions changed**

- **Social protection at scale**: general-equilibrium and long-run effects, targeting

- **The psychology of poverty**: attention, mental health, the value of work

- **Microdata for macro questions**: what frictions add up to

- **Environment and development**: adaptation, regulation
]

.pull-right[
**The methods changed too**

- Small RCTs to **administrative data at scale**

- **Quasi-experimental designs**: thresholds, staggered rollouts

- **Long-run and dynamic** effects

- **Measurement and machine learning**
]

--

Every field moves like this. Read a recent review or program report in your field before you commit to a question.

.source[&lt;a href="https://www.nber.org/reporter/2026number1/program-report-development-economics"&gt;Jayachandran and Olken (2026)&lt;/a&gt;, NBER Development Economics program report.]

???

The program directors asked an AI model to summarize 1,972 NBER working papers and judged its description "broadly consistent" with their own reading. The field also retired questions: microcredit as a standalone growth tool, technology adoption in isolation, education judged by test scores alone, informality as a binary.

---

.pull-right[
- With **staggered adoption** and effects that **grow over time**, the standard two-way fixed effects DiD is **biased**

- New estimators fix this: &lt;a href="https://doi.org/10.1016/j.jeconom.2021.03.014"&gt;Goodman-Bacon (2021)&lt;/a&gt;, &lt;a href="https://doi.org/10.1016/j.jeconom.2020.12.001"&gt;Callaway and Sant'Anna (2021)&lt;/a&gt;, &lt;a href="https://doi.org/10.1016/j.jeconom.2020.09.006"&gt;Sun and Abraham (2021)&lt;/a&gt;, &lt;a href="https://doi.org/10.1257/aer.20181169"&gt;de Chaisemartin and D'Haultfoeuille (2020)&lt;/a&gt; -- referees now expect them

- Guide: &lt;a href="https://doi.org/10.1257/jel.20251650"&gt;Baker et al. (2026)&lt;/a&gt;, *Journal of Economic Literature*
]

--

**Being a researcher is a continuous learning process**: new literature, new methods, and new estimators for old methods.

???

If asked for the intuition: with staggered adoption, the TWFE coefficient is a weighted average of many 2x2 comparisons, and some compare newly treated units with already-treated ones; when effects grow over time, those comparisons enter with perverse (even negative) weights.

---

# Can you formulate your ideas as research questions?

--

- The most interesting research tends to be about **cause and effect**

--

  - the effect of schooling on wages; of unemployment insurance on jobs; of cash transfers on enrollment

--

- Think of an **ideal experiment** that would capture the effect

--

  - "the effect of a cause is always relative to another cause"

--

  - If you cannot imagine the experiment, the odds with non-experimental data are slim

---

# A good research question: three properties

From &lt;a href="https://shapiro.scholars.harvard.edu/sites/g/files/omnuum7731/files/shapiro/files/foursteps.pdf"&gt;Shapiro, Four Steps to an Applied Micro Paper&lt;/a&gt;:

--

- **The question has an answer.** "What is the effect of a price ceiling on the quantity of ketchup sold?" has one -- we may not know it, but it exists. "What is the nature of firm and consumer behavior in the ketchup industry?" does not

--

- **The answer is not obvious** -- we cannot already get it from logic, common sense, or existing evidence. "Would selling ketchup only on Tuesdays improve consumer welfare?" has an answer, but we can guess it

--

- **The answer is actionable.** If we knew it, a policymaker, firm, or NGO would do something differently. Uniform wholesale pricing of ketchup: real policy, actionable. Ketchup teleportation: hypothetical

--

Test your question against all three **before** worrying about data or identification.

???

The examples are Shapiro's, originally written for PhD students in industrial organization. "Actionable" is the "why should people care" test applied to the answer rather than the topic.

---

# A warning: some questions have no answer

The effect of **school start age** on first-grade test scores.

--

- Ideal experiment: randomize starting first grade at age 6 versus age 7, then compare test scores

--

- But while children are in school, **age at the test = start age + time in school**

--

  - Compare in the same grade: the later group is **older** -- you pick up maturation

--

  - Compare at the same age: the later group has **less schooling** -- you pick up time in school

--

- No design can vary start age alone. The question is **fundamentally unidentified** -- no data, and no experiment, can answer it

--

- **Twist the question** until it has an answer: for adults, years since school varies too, so the effect of start age on *adult earnings* is identified

???

If we ran the "ideal" regression of scores on start age, time in school, and age, the three regressors are perfectly collinear -- this is not confounding, it is a definition, and randomization does not help. Only a different question does. Ask the class: can you think of other fundamentally unidentified questions? What about your own?

---

# Before you commit: five feasibility checks

A question can be well-posed, non-obvious, and actionable -- and still not be *your* project. Ask:

--

- Do I have the **facts** right?

--

- Do I have the right **data**?

--

- Would the effect be **detectable**? Is the sample large enough?

--

- Is the paper interesting **if I find nothing**?

--

- Can I finish it in **reasonable time**?

---

# Read the paper yourself

- Reading published papers is how you learn to write one: inspect **how** the authors build the argument, not only what they find

--

- Read the paper -- **not an AI summary**. The point is to practice reading, not to know the conclusion

--

- The same applies in this colloquium: presenters circulate their drafts or slides in advance -- read them, and prepare your comments

---

# How to read a paper: seven questions

1. **Question and contribution**: what is new?

2. **Ideal experiment**: how far is the paper from it?

3. **Theory**: assumptions, testable predictions

4. **Data**: unit, variables, measurement, selection

5. **Empirical strategy**: estimand, identification, inference

6. **Results**: magnitudes, alternative interpretations, mechanisms

7. **Broader lessons**: external validity, policy, one idea for you

???

These questions are also how to give useful comments when a classmate presents: questions 1, 2, 5, and 6 are where most useful feedback lives.

---

# The research talk: the skeleton

A 30-minute talk, 15-20 slides:

1. **Motivation and question**: one slide

2. **What we do and what we find**: one slide

3. **Setting and data**

4. **Research design**: estimand, identifying assumption, why plausible

5. **The main result**: one figure or table

6. **Threats and robustness**: the discussant's objections, answered

7. **Takeaways**

--

The 1-hour version **expands the sections**; it does not add new ones. For early-stage work: same skeleton, lighter middle, and end with the **questions you want feedback on**.

???

Based on Shapiro, "How to give an applied micro talk". The most common mistake: spending 15 minutes on background before saying what the paper does. Slides 1 and 2 fix that.

---

# Presenting your own work

- Present whenever you can: friends, faculty, conferences -- and here

--

- Prepare three versions: **1 minute**, **5 minutes**, **15-20 minutes**

--

  - The longer versions (**30, 60, 90 minutes** -- a seminar or job talk) are built from the same skeleton, expanded

--

- Know how your paper differs from the others on the same question

--

- Guides by Jesse Shapiro: &lt;a href="https://shapiro.scholars.harvard.edu/sites/g/files/omnuum7731/files/shapiro/files/applied_micro_slides.pdf"&gt;How to give an applied micro talk&lt;/a&gt; and &lt;a href="https://shapiro.scholars.harvard.edu/sites/g/files/omnuum7731/files/shapiro/files/foursteps.pdf"&gt;Four steps to an applied micro paper&lt;/a&gt;

--

- On writing: &lt;a href="https://www.johnhcochrane.com/research-all/writing-tips-for-phd-studentsnbsp"&gt;Cochrane, Writing Tips for Ph.D. Students&lt;/a&gt;

# How the colloquium works

- We meet on **Wednesdays, 12:00-13:30** (room and Zoom link on eKDIS)

--

- Weeks 2-10: **Sep 16 -- Nov 18** (no session Sep 23, holiday). Each of you gives one presentation, choosing the length when you sign up:

--

  - **30 minutes + 10 minutes** of feedback and Q&amp;A -- two presentations fit in a session, or

--

  - **1 hour + 15 minutes**, if you have more to present -- this takes the whole session

--

- **Circulate your draft or slides by Monday** of your week (two days before), on eKDIS -- so that everyone has time to read your work and prepare comments

---

# Credit and requirements

- Grading is **Pass/Fail**, based on attendance: attend at least **8 of the 10 sessions**

--

- A colloquium presentation can fulfill the **Research Plan / Research Progress Presentation** requirement -- separate guidance will follow for those of you who are due

--

- Each semester the colloquium holds a **presentation contest**: the best presentation wins a prize

--

- Students who have already completed the colloquium requirement are welcome to **audit** -- apply through eKDIS

---

# Sign-up for your presentation slot

- The sign-up sheet is going around now (and will be posted on eKDIS)

--

- Pick a **week** and a **length** (30 + 10, or 60 + 15)

--

  - If your work is further along, consider an early week; if you are still exploring an idea, a later slot lets you hear others first

--

- If you need to swap slots later, let us know as early as possible
