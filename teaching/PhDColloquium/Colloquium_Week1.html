---

# Introductions

Let us go around the room first — in about 30 seconds each:

--

- Your **name** and **cohort**

--

- Your **research interests**, or the area you are exploring

--

- **What you hope to get** from this colloquium

--

- Whether you **plan to present** this semester

---

# What this colloquium is

- A weekly seminar built on **your** work: from Week 2 on, sessions are student presentations

--

- **Wednesdays, 12:00-13:30, Room S203**; Weeks 2-10: **Sep 16 – Nov 18** (no Sep 23, holiday)

--

- Presenting is by **sign-up**, and anything from an early-stage idea to a full draft is welcome

--

- We encourage everyone to take a slot: feedback arrives **while your project is easy to change**

---

# Your presentation

- Choose the length when you sign up:

--

  - **20 minutes + 10 minutes** of feedback and Q&amp;A — two presentations per session, or

--

  - **40 minutes + 20 minutes** of feedback, if you have more to present — one presentation per session

--

- **Post your draft or slides on eKDIS by the Monday before**, so everyone can prepare comments

--

- **Open weeks**: a senior student talk, or a joint reading (e.g., DiD/IV/RD methods)

---

# Credit and requirements

- Grading is **Pass/Fail**, based on attendance: attend at least **8 of the 10 sessions**

--

- A presentation here can fulfill the **Research Plan / Progress Presentation** requirement

--

- Each semester's **presentation contest**: the best presentation wins a prize

--

- Students who completed the requirement may attend as **auditors** (register on eKDIS)

--

- Registered or auditing, attend **as many sessions as you can** — you learn from your peers

---

# Sign-up for your presentation slot

- Pick a **week** and a **length** on the sheet going around now

--

  - If your work is further along, take an early week; if you are still exploring, take a later one

--

- If you would like more time to decide, email me your week and length by **Friday (Sep 11)**

--

- The final schedule will be posted on **eKDIS** next week; tell us early if you need to swap

---

# Doing research

- Research is about making discoveries: generating new knowledge

--

- How big do the discoveries need to be for a successful PhD?

--

  - Not a **top-5** publication

--

  - A dissertation or thesis that contributes to the literature, even a little

--

  - and the job you want

---

# Writing a dissertation (or a paper)

- There is no single right way, but you have to do it

--

- There is no "right topic", but work on something **important** that **genuinely interests you**

--

  - You will live with it for months or years; an unimportant topic takes as long to write as an important one

--

- What makes a topic important? Ask: **why should people care?**

--

  - **Real-world impact + new knowledge (even a bit) = important topic**

---

---

# Where to look for ideas: journals

- **Top 5**: *AER*, *QJE*, *JPE*, *Review of Economic Studies*, *Econometrica*

--

- **Top general interest**: *AEJ: Applied*, *AEJ: Economic Policy*, *REStat*, *Economic Journal*, *JEEA*

--

- **Top field journals**: *Journal of Public Economics*, *Journal of Development Economics*, *Journal of Labor Economics*, *Journal of Health Economics*, *Journal of Environmental Economics and Management*, *Journal of Monetary Economics*, *Journal of International Economics*, and their counterparts in your field

--

- **Reviews**: *Journal of Economic Literature*, *Journal of Economic Perspectives*, *Annual Review of Economics*

---

# Where to look for ideas: before the journals

- **Working papers**: &lt;a href="https://www.nber.org/papers"&gt;NBER&lt;/a&gt;, &lt;a href="https://cepr.org/publications/discussion-papers"&gt;CEPR&lt;/a&gt;, &lt;a href="https://www.iza.org/publications/dp"&gt;IZA&lt;/a&gt;, &lt;a href="https://www.worldbank.org/en/research"&gt;World Bank Policy Research&lt;/a&gt;

--

- **Seminars**: on campus and online — go, and watch how people ask questions

--

- **Blogs and digests**: &lt;a href="https://voxdev.org/"&gt;VoxDev&lt;/a&gt;, the World Bank &lt;a href="https://blogs.worldbank.org/en/impactevaluations"&gt;Development Impact&lt;/a&gt; blog, NBER program reports

--

- **People**: the leading researchers in your field, and what they are presenting now

--

- **Elsewhere**: newspapers and books, even in other fields

---

class: compact

# Research moves: development economics, 2018-2025

.pull-left[
**The questions changed**

- **Social protection at scale**: general-equilibrium and long-run effects, targeting

- **The psychology of poverty**: attention, mental health, the value of work

- **Microdata for macro questions**: what frictions add up to

- **Environment and development**: adaptation, regulation
]

.pull-right[
**The methods changed too**

- Small RCTs to **administrative data at scale**

- **Quasi-experimental designs**: thresholds, staggered rollouts

- **Long-run and dynamic** effects

- **Measurement and machine learning**
]

--

.takeaway[Every field moves like this — read a recent review in your field before committing to a question]

.source[&lt;a href="https://www.nber.org/reporter/2026number1/program-report-development-economics"&gt;Jayachandran and Olken (2026)&lt;/a&gt;, NBER Development Economics program report.]

???

The program directors asked an AI model to summarize 1,972 NBER working papers and judged its description "broadly consistent" with their own reading. The field also retired questions: microcredit as a standalone growth tool, technology adoption in isolation, education judged by test scores alone, informality as a binary.

---

class: compact

# Even methods you know keep changing: DiD

.fig-left[
&lt;img src="goodmanbacon_fig2.png" style="width: 100%;" /&gt;
.source[&lt;a href="https://doi.org/10.1016/j.jeconom.2021.03.014"&gt;Goodman-Bacon (2021)&lt;/a&gt;, Figure 2: the four 2x2 comparisons inside TWFE.]
]

.fig-right[
- With **staggered adoption**, TWFE averages all four 2x2 comparisons — including **Panel D**: late-treated vs. **already-treated** units

- When effects **grow over time**, Panel D biases the estimate

- New estimators fix this: &lt;a href="https://doi.org/10.1016/j.jeconom.2020.12.001"&gt;Callaway and Sant'Anna (2021)&lt;/a&gt;, &lt;a href="https://doi.org/10.1016/j.jeconom.2020.09.006"&gt;Sun and Abraham (2021)&lt;/a&gt;, among others

- Guide: &lt;a href="https://doi.org/10.1257/jel.20251650"&gt;Baker et al. (2026)&lt;/a&gt;, *JEL*
]

--

.takeaway[Being a researcher is continuous learning: new literature, new methods, new estimators for old methods]

???

If asked for the intuition: with staggered adoption, the TWFE coefficient is a weighted average of many 2x2 comparisons, and some compare newly treated units with already-treated ones; when effects grow over time, those comparisons enter with perverse (even negative) weights. "Among others" includes de Chaisemartin and D'Haultfoeuille (2020, AER) and Borusyak, Jaravel, and Spiess (2024, ReStud).

---

# Can you formulate your ideas as research questions?

--

- The most interesting research tends to be about **cause and effect**

--

  - the effect of schooling on wages; of unemployment insurance on jobs; of cash transfers on enrollment

--

- Think of an **ideal experiment** that would capture the effect

--

  - "the effect of a cause is always relative to another cause"

--

  - If you cannot imagine the experiment, the odds with non-experimental data are slim

---

# A good research question: three properties

From &lt;a href="https://shapiro.scholars.harvard.edu/sites/g/files/omnuum7731/files/shapiro/files/foursteps.pdf"&gt;Shapiro, Four Steps to an Applied Micro Paper&lt;/a&gt;:

--

- **1. The question has an answer**

  - "The effect of a price ceiling on ketchup sales" has one; "the nature of behavior in the ketchup industry" does not

--

- **2. The answer is not obvious** — your findings are interesting regardless of what you find

  - "Does ketchup-only-on-Tuesdays hurt consumers?" has an answer — but we can already guess it

--

- **3. The answer is actionable**

  - If we knew it, someone — a policymaker, a firm, an NGO — would do something differently

--

Test your question against all three **before** worrying about data or identification.

???

The examples are Shapiro's, originally written for PhD students in industrial organization. Fuller versions: "What is the effect of a price ceiling on the quantity of ketchup sold?" — we may not know the answer, but it exists; "What is the nature of firm and consumer behavior in the ketchup industry?" has no answer. Actionable: uniform wholesale pricing of ketchup is a real policy; ketchup teleportation is hypothetical. "Actionable" is the "why should people care" test applied to the answer rather than the topic.

---

# A warning: some questions have no answer

The effect of **school start age** on first-grade test scores.

--

- Ideal experiment: randomize starting school at 6 versus 7, then compare test scores

--

- But while children are in school, **age at the test = start age + time in school**

--

  - Compare in the same grade: the later group is **older** — you pick up maturation

--

  - Compare at the same age: the later group has **less schooling** — you pick up time in school

--

- No design can vary start age alone: the question is **fundamentally unidentified**

--

- **Twist the question** until it has an answer: start age on *adult earnings* is identified

???

If we ran the "ideal" regression of scores on start age, time in school, and age, the three regressors are perfectly collinear — this is not confounding, it is a definition, and randomization does not help. Only a different question does. Ask the class: can you think of other fundamentally unidentified questions? What about your own?

---

# Before you commit: five feasibility checks

A question can be well-posed, non-obvious, and actionable — and still not be *your* project. Ask:

--

- Do I have the **facts** right?

--

- Do I have the right **data**?

--

- Would the effect be **detectable**? Is the sample large enough?

--

- Is the paper interesting **if I find nothing**?

--

- Can I finish it in **reasonable time**?

---

# Read the paper yourself

- Reading published papers is how you learn to write one: study **how** the argument is built

--

- Read the paper — **not an AI summary**. The point is to practice reading, not to know the conclusion

--

- In this colloquium too: drafts circulate in advance — read them and prepare your comments

---

# How to read a paper: seven questions

1. **Question and contribution**: what is new?

2. **Ideal experiment**: how far is the paper from it?

3. **Theory**: assumptions, testable predictions

4. **Data**: unit, variables, measurement, selection

5. **Empirical strategy**: estimand, identification, inference

6. **Results**: magnitudes, alternative interpretations, mechanisms

7. **Broader lessons**: external validity, policy, one idea for you

--

**Referee reports** are part of the job — these questions are their skeleton; this room is practice

???

These questions are also how to give useful comments when a classmate presents: questions 1, 2, 5, and 6 are where most useful feedback lives.

---

# How to write a paper

*"Do one thing and do it completely"* (Richard Blundell)

--

- Not many things at once; not everything you know

--

- Tell **one convincing story**: every result is a piece of the same jigsaw puzzle

--

- Read papers for **how** they tell their story, not only what they find

--

- Short guides: &lt;a href="https://www.johnhcochrane.com/research-all/writing-tips-for-phd-studentsnbsp"&gt;Cochrane, Writing Tips for Ph.D. Students&lt;/a&gt;; &lt;a href="https://www.cgdev.org/blog/how-write-introduction-your-development-economics-paper"&gt;Evans, How to Write the Introduction&lt;/a&gt;

---

# The research talk: the skeleton

A 20-minute talk, 10-15 slides:

1. **Motivation and question**: one slide

2. **What we do and what we find**: one slide

3. **Setting and data**

4. **Research design**: estimand, identifying assumption, why plausible

5. **The main result**: one figure or table

6. **Threats and robustness**: the discussant's objections, answered

7. **Takeaways**

--

Longer talks expand the sections; early-stage talks end with the **questions you want feedback on**

???

Based on Shapiro, "How to give an applied micro talk". The most common mistake: spending 15 minutes on background before saying what the paper does. Slides 1 and 2 fix that.

---

# Presenting your own work

- Present whenever you can: friends, faculty, conferences — and here

--

- Prepare three versions: **1 minute**, **5 minutes**, **15-20 minutes**

--

  - The longer versions (**30, 60, 90 minutes** — a seminar or job talk) are built from the same skeleton, expanded

--

- Know how your paper differs from the others on the same question

--

- Guides: &lt;a href="https://shapiro.scholars.harvard.edu/sites/g/files/omnuum7731/files/shapiro/files/applied_micro_slides.pdf"&gt;Shapiro, How to Give an Applied Micro Talk&lt;/a&gt; and &lt;a href="https://shapiro.scholars.harvard.edu/sites/g/files/omnuum7731/files/shapiro/files/foursteps.pdf"&gt;Four Steps to an Applied Micro Paper&lt;/a&gt;

#toc-btn:hover { background: #EB811B; }
#toc-list { display: none; position: absolute; bottom: 34px; left: 0; width: 430px;
  background: #ffffff; border: 1px solid #d9dee0; border-radius: 6px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.18); padding: 6px 0; }
#toc-menu.open #toc-list { display: block; }
#toc-list a { display: block; padding: 8px 16px; font-size: 14px; color: #23373B;
  text-decoration: none; line-height: 1.35; }
#toc-list a:hover { background: #eef2f3; color: #EB811B; }
#toc-list a b { color: inherit; }
#progress-bar { position: fixed; bottom: 0; left: 0; height: 4px; width: 0; background: #EB811B; z-index: 300; transition: width 0.2s; }
@media print { #toc-menu, #progress-bar { display: none; } }
</style>
<script>
(function() {
  var menu = document.getElementById('toc-menu');
  var btn = document.getElementById('toc-btn');
  btn.addEventListener('click', function(e) {
    e.stopPropagation();
    menu.classList.toggle('open');
  });
  document.getElementById('toc-list').addEventListener('click', function() {
    menu.classList.remove('open');
  });
  document.addEventListener('click', function(e) {
    if (!menu.contains(e.target)) { menu.classList.remove('open'); }
  });
  function init() {
    if (typeof slideshow === 'undefined') { setTimeout(init, 150); return; }
    var bar = document.getElementById('progress-bar');
    var n = slideshow.getSlideCount();
    slideshow.on('showSlide', function(slide) {
      bar.style.width = (100 * (slide.getSlideIndex() + 1) / n) + '%';
    });
    bar.style.width = (100 * (slideshow.getCurrentSlideIndex() + 1) / n) + '%';
  }
  init();
})();
</script>

<script>
slideshow._releaseMath = function(el) {
  var i, text, code, codes = el.getElementsByTagName('code');
  for (i = 0; i < codes.length;) {
    code = codes[i];
    if (code.parentNode.tagName !== 'PRE' && code.childElementCount === 0) {
      text = code.textContent;
      if (/^\\\((.|\s)+\\\)$/.test(text) || /^\\\[(.|\s)+\\\]$/.test(text) ||
          /^\$\$(.|\s)+\$\$$/.test(text) ||
          /^\\begin\{([^}]+)\}(.|\s)+\\end\{[^}]+\}$/.test(text)) {
        code.outerHTML = code.innerHTML;  // remove <code></code>
        continue;
      }
    }
    i++;
  }
};
slideshow._releaseMath(document);
</script>
