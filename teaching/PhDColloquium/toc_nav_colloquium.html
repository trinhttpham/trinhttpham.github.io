  <button id="toc-btn" type="button">&#9776;&nbsp; Contents</button>
  <div id="toc-list">
    <a href="#part1"><b>Part 1.</b> This semester</a>
    <a href="#part2"><b>Part 2.</b> The life of a researcher</a>
    <a href="#part3"><b>Part 3.</b> Research ideas and research questions</a>
    <a href="#part4"><b>Part 4.</b> Reading, writing, and presenting</a>
  </div>
</div>
<div id="progress-bar"></div>
<style>
#toc-menu { position: fixed; bottom: 10px; left: 14px; z-index: 300; }
#toc-btn { background: rgba(35, 55, 59, 0.75); color: #fafafa; border: none; border-radius: 4px;
  padding: 5px 12px; font-size: 13px; font-family: inherit; cursor: pointer; }
#toc-btn:hover { background: #EB811B; }
#toc-list { display: none; position: absolute; bottom: 34px; left: 0; width: 430px;
  background: #ffffff; border: 1px solid #d9dee0; border-radius: 6px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.18); padding: 6px 0; }
#toc-menu.open #toc-list { display: block; }
#toc-list a { display: block; padding: 8px 16px; font-size: 14px; color: #23373B;
  text-decoration: none; line-height: 1.35; }
#toc-list a:hover { background: #eef2f3; color: #EB811B; }
#toc-list a b { color: inherit; }
#progress-bar { position: fixed; bottom: 0; left: 0; height: 4px; width: 0; background: #EB811B; z-index: 300; transition: width 0.2s; }
@media print { #toc-menu, #progress-bar { display: none; } }
</style>
<script>
(function() {
  var menu = document.getElementById('toc-menu');
  var btn = document.getElementById('toc-btn');
  btn.addEventListener('click', function(e) {
    e.stopPropagation();
    menu.classList.toggle('open');
  });
  document.getElementById('toc-list').addEventListener('click', function() {
    menu.classList.remove('open');
  });
  document.addEventListener('click', function(e) {
    if (!menu.contains(e.target)) { menu.classList.remove('open'); }
  });
  function init() {
    if (typeof slideshow === 'undefined') { setTimeout(init, 150); return; }
    var bar = document.getElementById('progress-bar');
    var n = slideshow.getSlideCount();
    slideshow.on('showSlide', function(slide) {
      bar.style.width = (100 * (slide.getSlideIndex() + 1) / n) + '%';
    });
    bar.style.width = (100 * (slideshow.getCurrentSlideIndex() + 1) / n) + '%';
  }
  init();
})();
</script>
